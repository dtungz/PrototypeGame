<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hộp Cơm Việt–Hàn · Prototype</title>
<style>
  :root{
    --bg:#fbf1e4; --frame:#b5506a; --frameDark:#7e2f45; --frameLight:#c96a82; --empty:#8f3a52;
    --ink:#3a2a22; --muted:#8d7666; --page:#fffdf8; --ok:#3aa76d; --bad:#d6453a;
    --wood:#c89462; --woodTop:#ddb07f; --woodDark:#9c6b3f; --slot:#b07c4c;
    --gap:3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; color:var(--ink); overflow:hidden;
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  body{background:var(--bg); transition:background .4s}
  #app{max-width:440px; height:100%; margin:0 auto; display:flex; flex-direction:column; padding:12px 16px 10px; gap:10px; user-select:none}

  /* ---------- Sổ công thức ---------- */
  .book{display:flex; justify-content:center; flex:none; filter:drop-shadow(0 4px 0 var(--frameDark))}
  .page{background:var(--page); border:3px solid var(--frameDark); height:128px; position:relative}
  .page.left{width:46%; border-radius:12px 4px 4px 12px; border-right-width:1.5px; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; align-content:center}
  .page.right{width:46%; border-radius:4px 12px 12px 4px; border-left-width:1.5px; display:flex; align-items:center; justify-content:center}
  .rings{position:absolute; right:-9px; top:14px; bottom:14px; display:flex; flex-direction:column; justify-content:space-between; z-index:2}
  .rings i{display:block; width:16px; height:7px; border-radius:4px; background:#cfc6bb; border:1.5px solid #8f857a}
  .pbtn{border:0; background:#f1ebe2; border-radius:10px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); padding:0}
  .pbtn svg{width:24px; height:24px}
  .pbtn:active{transform:scale(.94)}
  .pbtn:disabled{opacity:.35}
  .lvl{display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px}
  .targetwrap{background:color-mix(in srgb, var(--frame) 18%, #fff); padding:6px; border-radius:6px}
  .hintbtn{position:absolute; top:5px; right:5px; width:30px; height:30px; border-radius:50%; border:2px dashed #d9cfc2; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; padding:0}
  .hintbtn b{position:absolute; bottom:-6px; right:-6px; background:var(--frame); color:#fff; font-size:10px; border-radius:8px; min-width:16px; height:16px; line-height:16px}

  /* ---------- Hộp bento ---------- */
  .boxarea{flex:1 1 0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px}
  .bento{position:relative; padding:12px 12px 0; border-radius:8px 8px 4px 4px;
    background:
      repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.08) 6px 12px),
      repeating-linear-gradient(-45deg, transparent 0 6px, rgba(0,0,0,.06) 6px 12px), var(--frame);
    box-shadow:0 10px 18px rgba(60,30,20,.18)}
  .bento .lip{height:26px; margin:10px -12px 0; border-radius:0 0 4px 4px;
    background:
      repeating-linear-gradient(60deg, transparent 0 7px, rgba(255,255,255,.12) 7px 9px),
      repeating-linear-gradient(-60deg, transparent 0 7px, rgba(255,255,255,.12) 7px 9px), var(--frameDark)}
  #box{position:relative; display:grid; gap:var(--gap); background:var(--empty); padding:var(--gap); border-radius:4px; box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
  .bcell{position:relative; border-radius:5px; touch-action:none; background:color-mix(in srgb, var(--empty) 88%, #fff); box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
  .bcell .tile{position:absolute; inset:0}
  .bcell.top{box-shadow:0 0 0 2px #fff, 0 4px 10px rgba(0,0,0,.35); z-index:1}
  .bcell.top:after{content:""; position:absolute; inset:3px; border:2px dashed rgba(255,255,255,.95); border-radius:4px; pointer-events:none}
  .badge{position:absolute; right:3px; bottom:3px; background:rgba(30,20,15,.7); color:#fff; font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; pointer-events:none}
  #overlay{position:absolute; inset:0; pointer-events:none}
  .gcell{position:absolute; border-radius:5px}
  .gcell .tile{opacity:.7}
  .gcell.ok{outline:3px solid #fff; outline-offset:-3px; box-shadow:0 0 0 2px var(--ok)}
  .gcell.bad{background:rgba(214,69,58,.45); outline:3px solid var(--bad); outline-offset:-3px}
  .gcell.fusion{outline:3px solid #ffd23f; outline-offset:-3px; box-shadow:0 0 16px 4px rgba(255,200,40,.9); animation:glow .6s ease-in-out infinite alternate}
  .gcell.fusion .tile{opacity:.95}
  .gcell.gone{outline:3px dashed #ffe066; outline-offset:-3px; background:rgba(255,230,100,.25)}
  .gcell.gone:after{content:"↑"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; color:#fff; text-shadow:0 1px 3px #000}
  .gcell.idle{outline:2px dashed rgba(255,255,255,.6); outline-offset:-3px}
  .gcell.hint{outline:3px solid #6fc3ff; outline-offset:-3px; box-shadow:0 0 14px 3px rgba(80,170,255,.8); animation:glow .7s ease-in-out infinite alternate}
  @keyframes glow{from{filter:brightness(1)} to{filter:brightness(1.25)}}
  .tip{font-size:12px; color:var(--muted); text-align:center; min-height:16px; padding:0 8px; line-height:1.35}
  .tip b{color:var(--frameDark)}

  /* ---------- Ô nguyên liệu ---------- */
  .tile{display:block; width:100%; height:100%; border-radius:5px; overflow:hidden; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .tile svg{width:100%; height:100%; display:block}

  /* ---------- Khay gỗ ---------- */
  .tray{flex:none; position:relative; padding:10px 10px 12px; border-radius:16px 16px 10px 10px;
    background:linear-gradient(var(--woodTop) 0 12px, var(--wood) 12px); box-shadow:0 5px 0 var(--woodDark)}
  .tray:before,.tray:after{content:""; position:absolute; bottom:-16px; width:16px; height:14px; background:var(--woodDark); border-radius:0 0 4px 4px}
  .tray:before{left:22px} .tray:after{right:22px}
  #hand{display:flex; gap:8px; justify-content:center}
  .slot{flex:1; max-width:80px; aspect-ratio:1/1.08; border-radius:10px; background:var(--slot);
    box-shadow:inset 0 3px 6px rgba(60,30,10,.35); display:flex; align-items:center; justify-content:center; position:relative}
  .slot.empty:after{content:""; width:30%; height:30%; border-radius:4px; background:rgba(0,0,0,.08)}
  .piece{position:relative; touch-action:none; cursor:grab; transition:transform .18s ease, opacity .15s; filter:drop-shadow(0 2px 0 rgba(60,30,10,.35))}
  .piece.ghosted{opacity:.2}
  .piece.spin{transform:rotate(90deg)}
  .piece.pulse{animation:pulse .8s ease-in-out infinite}
  .piece.pop{animation:pop .45s ease-out}
  @keyframes pulse{50%{transform:scale(1.12); filter:drop-shadow(0 0 6px #6fc3ff) drop-shadow(0 0 2px #6fc3ff)}}
  @keyframes pop{0%{transform:scale(.3)} 70%{transform:scale(1.15)} 100%{transform:scale(1)}}
  .pgrid{display:grid}
  .pcell{position:relative}
  .lock{position:absolute; top:-7px; right:-7px; width:17px; height:17px; border-radius:50%; background:#fff; border:2px solid var(--bad);
    color:var(--bad); font-size:11px; font-weight:900; line-height:13px; text-align:center; z-index:2}
  .fillmark{position:absolute; inset:0; border-radius:5px; border:2px dashed rgba(255,255,255,.9); pointer-events:none}
  .fillicon{position:absolute; left:-7px; bottom:-7px; width:18px; height:18px; border-radius:50%; background:#fff; z-index:2; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .fillicon svg{width:12px; height:12px}
  .rulebar{font-size:11px; color:var(--muted); text-align:center; margin-top:10px}

  /* ---------- Kéo thả, popup ---------- */
  #float{position:fixed; left:0; top:0; pointer-events:none; z-index:50; filter:drop-shadow(0 10px 12px rgba(0,0,0,.3)); opacity:.92; display:none}
  #float .piece{filter:none}
  #float.bad{opacity:.7}
  #float.over{opacity:.45}
  #layers{position:fixed; z-index:60; background:#fff; border-radius:12px; padding:8px 10px; box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:12px; min-width:150px; display:none}
  #layers h4{margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:700}
  #layers .row{display:flex; align-items:center; gap:8px; padding:3px 0}
  #layers .row .tile{width:26px; height:26px; flex:none}
  #layers .row.top b{color:var(--frame)}
  #toast{position:fixed; left:50%; bottom:26%; transform:translate(-50%,20px); background:rgba(45,30,20,.92); color:#fff; padding:10px 16px; border-radius:20px;
    font-size:13px; opacity:0; transition:.25s; z-index:70; max-width:88%; text-align:center; pointer-events:none}
  #toast.show{opacity:1; transform:translate(-50%,0)}
  .fxname{position:fixed; z-index:65; pointer-events:none; background:#fff; border:2px solid #ffd23f; border-radius:14px; padding:4px 10px; font-weight:800; font-size:13px;
    white-space:nowrap; transform:translate(-50%,-50%); animation:floatup 1.3s ease-out forwards; box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .fxname small{color:#e0533a; margin-left:4px}
  @keyframes floatup{0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 15%{opacity:1; transform:translate(-50%,-60%) scale(1.05)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-140%)}}
  .spark{position:fixed; z-index:64; width:8px; height:8px; border-radius:50%; pointer-events:none; animation:spark .6s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0}}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}

  /* ---------- Overlay: thắng / chọn màn ---------- */
  .modal{position:fixed; inset:0; background:rgba(40,25,15,.5); display:none; align-items:center; justify-content:center; z-index:80; padding:16px}
  .modal.show{display:flex}
  .sheet{width:100%; max-width:360px; background:var(--page); border:3px solid var(--frameDark); border-radius:16px; padding:18px 16px; text-align:center;
    box-shadow:0 6px 0 var(--frameDark), 0 20px 40px rgba(0,0,0,.3); animation:pop .45s ease-out}
  .sheet h2{margin:0; font-size:22px}
  .sheet .ko{color:var(--muted); font-size:13px; margin-top:2px}
  .sheet .mini{display:inline-block; margin:14px 0 10px; animation:slide .6s ease-out}
  @keyframes slide{from{transform:translateY(-30px) rotate(-6deg); opacity:0}}
  .quote{background:var(--bg); border-radius:12px; padding:8px 12px; font-size:13.5px; line-height:1.4}
  .btns{display:flex; gap:8px; justify-content:center; margin-top:14px}
  .btns button,.lvlist button{border:0; font:inherit; font-weight:800; padding:11px 18px; border-radius:12px; cursor:pointer}
  .btn1{background:var(--frame); color:#fff; box-shadow:0 3px 0 var(--frameDark)}
  .btn2{background:#efe7dc; color:var(--ink); box-shadow:0 3px 0 #d3c6b5}
  .lvlist{display:flex; flex-direction:column; gap:8px; margin-top:12px; text-align:left}
  .lvlist button{display:flex; align-items:center; gap:10px; background:#f4eee6; box-shadow:0 3px 0 #ddd0bf; text-align:left; padding:10px 12px}
  .lvlist button.cur{outline:3px solid var(--frame)}
  .lvlist .dot{width:30px; height:30px; flex:none; border-radius:8px}
  .lvlist small{display:block; color:var(--muted); font-weight:600; font-size:11.5px}
</style>
</head>
<body>
<div id="app">
  <section class="book">
    <div class="page left">
      <button class="pbtn" id="home" title="Chọn màn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></button>
      <div class="lvl" id="lvlname">1-1</div>
      <button class="pbtn" id="reset" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
      <button class="pbtn" id="undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <div class="rings"><i></i><i></i><i></i></div>
    </div>
    <div class="page right">
      <div class="targetwrap" id="target"></div>
      <button class="hintbtn" id="hint" title="Gợi ý">💡<b id="hints">3</b></button>
    </div>
  </section>

  <section class="boxarea" id="boxarea">
    <div class="bento"><div id="box"></div><div class="lip"></div></div>
    <div class="tip" id="tip"></div>
  </section>

  <section>
    <div class="tray"><div id="hand"></div></div>
    <div class="rulebar">Chạm thẻ trên khay để xoay · chạm thẻ trên cùng (viền nét đứt) để trả về khay · giữ ô để xem lớp</div>
  </section>
</div>

<div id="float"></div>
<div id="layers"></div>
<div id="toast"></div>
<div class="modal" id="win">
  <div class="sheet">
    <h2>Hoàn thành! 🎉</h2>
    <div class="ko">완성! · Khách đã nhận hộp cơm</div>
    <div class="mini" id="winbox"></div>
    <div class="quote" id="winquote"></div>
    <div class="btns"><button class="btn2" id="again">Chơi lại</button><button class="btn1" id="next">Màn tiếp →</button></div>
  </div>
</div>
<div class="modal" id="levels">
  <div class="sheet">
    <h2>Chọn màn</h2>
    <div class="ko">Mỗi màn giới thiệu một loại thẻ</div>
    <div class="lvlist" id="lvlist"></div>
  </div>
</div>

<script>
//#LOGIC-START
const ING = {
  rice:        { vi:'Cơm',        ko:'밥' },
  kimchi:      { vi:'Kimchi',     ko:'김치' },
  egg:         { vi:'Trứng',      ko:'계란' },
  seaweed:     { vi:'Rong biển',  ko:'김' },
  rice_kimchi: { vi:'Cơm kimchi', ko:'김치밥', fusion:true },
};
// fusion.json — TẠM TẮT. Bật lại bằng cách thêm dòng, vd: { base:'rice', top:'kimchi', result:'rice_kimchi' }
const FUSION = [];
/* Loại thẻ & ký hiệu trong cells:
   food  : tên nguyên liệu         — đè lên ô
   fill  : tên nguyên liệu         — chỉ lấp ô trống, giữ nguyên ô đã có đồ
   swap  : 'a' (2 ô)               — đổi chỗ lớp trên cùng của 2 ô
   move  : 's' nguồn, 'd' đích     — đẩy lớp trên cùng của ô nguồn sang ô đích
   copy  : 's' nguồn, 'd' các đích — nhân bản lớp trên cùng của nguồn lên các ô đích
   grab  : 1                        — rút lớp trên cùng, tạo thẻ food mới trên tay
   lock:true trên bất kỳ thẻ nào    — cấm xoay */
const LEVELS = [
  { id:'1-1', name:'Đổi chỗ', theme:'pink', width:3, height:2,
    tip:'Thẻ <b>S!</b> đổi chỗ 2 nguyên liệu trên cùng. Thẻ có dấu <b style="color:#d6453a">✕</b> không xoay được.',
    quote:'“Trứng bên trái mới chuẩn vị! 감사합니다!”',
    target:[['egg','rice','rice'],['seaweed','seaweed','seaweed']],
    cards:[
      { type:'food', lock:true, cells:[['rice','egg','rice'],['seaweed','seaweed','seaweed']] },
      { type:'swap', cells:[['a','a']] },
    ]},
  { id:'1-2', name:'Đẩy', theme:'orange', width:3, height:2,
    tip:'Thẻ <b>M!</b> đẩy nguyên liệu trên cùng trượt 1 ô theo mũi tên — lộ ra lớp bên dưới.',
    quote:'“Một quả trứng ở giữa là đủ rồi~ Cảm ơn nha!”',
    target:[['rice','egg','rice'],['rice','rice','rice']],
    cards:[
      { type:'food', cells:[['rice','rice','rice'],['rice','rice','rice']] },
      { type:'food', lock:true, cells:[['egg','egg']] },
      { type:'move', cells:[['s','d']] },
    ]},
  { id:'1-3', name:'Gắp', theme:'green', width:3, height:2,
    tip:'Thẻ <b>G!</b> gắp nguyên liệu khỏi hộp và tạo ra <b>1 thẻ mới</b> trên tay. Phải đặt hết thẻ.',
    quote:'“Hai quả trứng hai bên, đẹp quá! 예쁘다!”',
    target:[['egg','rice','egg'],['rice','rice','rice']],
    cards:[
      { type:'food', cells:[['rice','rice','rice'],['rice','rice','rice']] },
      { type:'food', lock:true, cells:[['egg','egg']] },
      { type:'grab', cells:[[1]] },
    ]},
  { id:'1-4', name:'Nhân bản', theme:'teal', width:3, height:2,
    tip:'Thẻ <b>C!</b> nhân bản nguyên liệu ở ô nguồn (chấm tròn) lên các ô mũi tên.',
    quote:'“Ba quả trứng! Hôm nay mình đói lắm 배고파~”',
    target:[['egg','egg','egg'],['seaweed','seaweed','rice']],
    cards:[
      { type:'food', cells:[['rice','rice','rice'],['rice','rice','rice']] },
      { type:'food', cells:[['egg']] },
      { type:'food', lock:true, cells:[['seaweed','seaweed']] },
      { type:'copy', cells:[['s','d','d']] },
    ]},
  { id:'1-5', name:'Lấp đầy', theme:'yellow', width:3, height:2,
    tip:'Thẻ <b>F!</b> chỉ lấp các ô trống, giữ nguyên ô đã có đồ.',
    quote:'“Kimchi riêng, cơm riêng — đúng ý mình! 좋아요!”',
    target:[['kimchi','rice','kimchi'],['rice','egg','rice']],
    cards:[
      { type:'food', lock:true, cells:[['kimchi',null,'kimchi']] },
      { type:'food', cells:[['egg']] },
      { type:'fill', cells:[['rice','rice','rice'],['rice','rice','rice']] },
    ]},
  { id:'1-6', name:'Hộp cơm Seoul', theme:'red', width:3, height:3,
    tip:'Màn tổng hợp: xoay, chồng lớp và <b>G!</b> gắp.',
    quote:'“Wa, có cả kimchi! 맛있겠다! Cảm ơn bạn nhiều nha~”',
    target:[['egg','kimchi','egg'],['rice','kimchi','rice'],['seaweed','seaweed','seaweed']],
    cards:[
      { type:'food', cells:[['rice','rice'],['rice','rice'],['rice','rice']] },
      { type:'food', cells:[['kimchi','kimchi']] },
      { type:'food', lock:true, cells:[['egg','egg']] },
      { type:'food', cells:[['seaweed'],['seaweed'],['seaweed']] },
      { type:'grab', cells:[[1]] },
    ]},
];

function fuse(base, top){ const f = FUSION.find(f => f.base===base && f.top===top); return f ? f.result : null; }
function rotateCW(cells){
  const h = cells.length, w = cells[0].length, out = [];
  for (let r=0; r<w; r++){ out.push([]); for (let c=0; c<h; c++) out[r].push(cells[h-1-c][r]); }
  return out;
}
function filled(v){ return v !== null && v !== 0 && v !== undefined; }
function fits(cells, x, y, W, H){
  for (let r=0; r<cells.length; r++) for (let c=0; c<cells[0].length; c++)
    if (filled(cells[r][c]) && (x+c<0 || y+r<0 || x+c>=W || y+r>=H)) return false;
  return true;
}
function trim(cells){
  const rows = cells.filter(row => row.some(filled));
  const keep = rows[0].map((_,c) => rows.some(row => filled(row[c])));
  return rows.map(row => row.filter((_,c) => keep[c]));
}
function rotsOf(card){
  const out = [], seen = new Set(); let cur = card.cells;
  for (let rot=0; rot<(card.lock ? 1 : 4); rot++){
    const k = JSON.stringify(cur);
    if (!seen.has(k)){ seen.add(k); out.push({ rot, cells:cur }); }
    cur = rotateCW(cur);
  }
  return out;
}
/* Áp một thẻ lên hộp. board[i] = chồng lớp {ing, card, under?} (dưới → trên); không sửa board gốc.
   Trả về null nếu không đặt được, ngược lại { board, fx (fusion), newCard (grab), added (ô thẻ để lại lớp) } */
function applyCard(board, card, cells, x, y, W, H){
  if (!fits(cells, x, y, W, H)) return null;
  const b = board.map(s => s.slice()), fx = [], added = [];
  const marks = {};
  cells.forEach((row,r) => row.forEach((v,c) => { if (filled(v)) (marks[v] = marks[v] || []).push((y+r)*W + x+c); }));
  const put = (i, ing, cid, layer) => {
    const st = b[i], top = st[st.length-1], f = top && fuse(top.ing, ing);
    if (f){ st[st.length-1] = { ing:f, card:cid, under:top }; fx.push({ idx:i, result:f }); }
    else st.push(layer || { ing, card:cid });
  };
  let newCard = null;
  switch (card.type){

    setTimeout(() => {
      chime();
      $('#winbox').innerHTML = `<div class="bento" style="padding:6px 6px 0"><div style="background:var(--empty);padding:2px;border-radius:3px">${gridHTML(S.board.reduce((rows,st,i) => { (rows[Math.floor(i/W)] = rows[Math.floor(i/W)] || []).push(topIng(st)); return rows; }, []), 30)}</div><div class="lip" style="height:12px;margin:6px -6px 0"></div></div>`;
      $('#winquote').innerHTML = LV.quote;
      $('#next').style.display = levelIdx < LEVELS.length-1 ? '' : 'none';
      $('#win').classList.add('show');
    }, 650);
  } else setTimeout(() => toast('Chưa giống mẫu, thử lại nhé! Bấm <b>Undo</b> để lùi từng bước.', 3200), 450);
}

/* ---------- Kéo / chạm ---------- */
let press = null, drag = null;
const floatEl = $('#float');
const pitch = () => CELL + GAP;
function startDrag(card, offX, offY){
  drag = { card, offX, offY, snap:null };
  const el = document.querySelector(`.piece[data-id="${card.id}"]`); el && el.classList.add('ghosted');
  floatEl.innerHTML = `<div class="piece">${pieceHTML(card, CELL)}</div>`;
  floatEl.style.display = 'block';
}
function moveDrag(e){
  const left = e.clientX - drag.offX, top = e.clientY - drag.offY;
  floatEl.style.transform = `translate(${left}px,${top}px)`;
  const br = $('#box').getBoundingClientRect(), p = pitch();
  const x = Math.round((left - br.left - GAP)/p), y = Math.round((top - br.top - GAP)/p);
  const near = e.clientX > br.left - p*.5 && e.clientX < br.right + p*.5 && e.clientY > br.top - p*.5 && e.clientY < br.bottom + p*.5;
  if (!near){ drag.snap = null; showOverlay([]); floatEl.classList.remove('bad', 'over'); return; }
  const pv = previewCells(drag.card, x, y);
  drag.snap = pv.valid ? { x, y } : null;
  floatEl.classList.toggle('bad', !pv.valid);
  floatEl.classList.toggle('over', pv.valid);
  showOverlay(pv.cells);
}
function endDrag(){
  const { card, snap } = drag;
  drag = null; floatEl.style.display = 'none'; floatEl.classList.remove('bad', 'over');
  if (!snap){ render(); return; }   // thả ra ngoài hộp: thẻ nằm lại trên khay
  const res = commit(card, snap.x, snap.y);
  SFX[card.type](); render(); fusionFx(res.fx);
  afterMove();
}
$('#hand').addEventListener('pointerdown', e => {
  const el = e.target.closest('.piece'); if (!el || won) return;
  const card = handCards().find(c => c.id === +el.dataset.id);
  const r = el.querySelector('.pgrid').getBoundingClientRect(), k = CELL / +el.dataset.hc;
  press = { kind:'hand', el, card, sx:e.clientX, sy:e.clientY, offX:(e.clientX - r.left)*k, offY:(e.clientY - r.top)*k };
  audio();
});
$('#box').addEventListener('pointerdown', e => {
  const el = e.target.closest('.bcell'); if (!el || won) return;
  const idx = +el.dataset.i, top = topEntry();
  press = { kind: top && top.idxs.includes(idx) ? 'top' : 'box', el, idx, sx:e.clientX, sy:e.clientY };
  press.timer = setTimeout(() => { if (press && press.idx === idx){ press.long = true; showLayers(idx, el); } }, 380);
  audio();
});
window.addEventListener('pointermove', e => {
  if (drag){ moveDrag(e); return; }
  if (!press || press.long) return;
  if (Math.hypot(e.clientX - press.sx, e.clientY - press.sy) < 7) return;
  clearTimeout(press.timer);
  if (press.kind === 'hand'){
    startDrag(press.card, press.offX, press.offY);
  } else if (press.kind === 'top'){
    const br = $('#box').getBoundingClientRect(), p = pitch();
    const { entry, card } = popTop();
    render();
    startDrag(card, press.sx - (br.left + GAP + entry.x*p), press.sy - (br.top + GAP + entry.y*p));
  } else {
    if (S.stack.length){
      const el = press.el; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400);
      toast('Chỉ kéo được thẻ đặt sau cùng (ô viền nét đứt).');
    }
    press = null; return;
  }
  press = null;
  moveDrag(e);
});
window.addEventListener('pointerup', () => {
  if (drag){ endDrag(); return; }
  if (!press) return;
  clearTimeout(press.timer);
  if (press.kind === 'hand') rotateCard(press.card, press.el);
  else if (press.kind === 'top' && !press.long) returnTop();
  hideLayers();
  press = null;
});
window.addEventListener('pointercancel', () => { if (drag){ drag.snap = null; endDrag(); } hideLayers(); press = null; });

function rotateCard(card, el){
  if (card.lock){
    el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400);
    toast('Thẻ có dấu ✕ bị khóa xoay.'); return;
  }
  if (rotsOf(card).length === 1){ el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 400); return; }
  el.classList.add('spin');
  setTimeout(() => { card.cells = rotateCW(card.cells); renderHand(); }, 170);
}
function showLayers(idx, el){
  const st = S.board[idx], pop = $('#layers');
  pop.innerHTML = `<h4>Các lớp trong ô (trên → dưới)</h4>` + (st.length
    ? st.slice().reverse().map((l,i) => `<div class="row ${i===0?'top':''}">${tile(l.ing)}<div><b>${ING[l.ing].vi}</b> · ${ING[l.ing].ko}${ING[l.ing].fusion?' <small>(fusion)</small>':''}</div></div>`).join('')
    : `<div class="row" style="color:var(--muted)">Ô trống</div>`);
  pop.style.display = 'block';
  const r = el.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(innerWidth - pr.width - 8, r.left + r.width/2 - pr.width/2)) + 'px';
  pop.style.top = Math.max(8, r.top - pr.height - 8) + 'px';
}
function hideLayers(){ $('#layers').style.display = 'none'; }

/* ---------- Nút ---------- */
function returnTop(){
  if (!S.stack.length || won) return;
  popTop(); tone(500, 250, .1, 'triangle', .2); render();
}
$('#undo').onclick = returnTop;
$('#reset').onclick = () => { if (!S.stack.length || won) return; S = newState(); render(); };
$('#hint').onclick = () => {
  if (won || hintShown) return;
  if (!hints){ toast('Hết gợi ý rồi! (Bản thật: nhận thêm từ thưởng / xem quảng cáo)'); return; }
  const hand = handCards();
  const res = solve(S.board, hand.map(c => ({ type:c.type, lock:c.lock, cells:c.cells })), LV, false);
  if (!res.first){ toast('Từ trạng thái này không còn lời giải — thử <b>Undo</b> nhé.', 3000); return; }
  hints--; $('#hints').textContent = hints;
  const step = res.first[0], card = hand[step.i];
  let cells = card.cells; for (let k=0; k<step.rot; k++) cells = rotateCW(cells);
  const cov = [];
  cells.forEach((row,r) => row.forEach((v,c) => { if (filled(v)) cov.push({ idx:(step.y+r)*W + step.x+c, cls:'hint' }); }));
  showOverlay(cov);
  const el = document.querySelector(`.piece[data-id="${card.id}"]`); el && el.classList.add('pulse');
  hintShown = true;
  toast(`💡 Đặt thẻ đang nhún vào ô xanh${step.rot ? ` — xoay <b>${step.rot}</b> lần trước` : ''}.`, 3500);
};
$('#again').onclick = () => { $('#win').classList.remove('show'); loadLevel(levelIdx); };
$('#next').onclick = () => { $('#win').classList.remove('show'); loadLevel(levelIdx + 1); };
$('#home').onclick = () => {
  $('#lvlist').innerHTML = LEVELS.map((l,i) =>
    `<button data-i="${i}" class="${i===levelIdx?'cur':''}"><span class="dot" style="background:${THEMES[l.theme].frame}"></span><span><b>${l.id} · ${l.name}</b><small>${l.tip.replace(/<[^>]+>/g,'')}</small></span></button>`).join('');
  $('#levels').classList.add('show');
};
$('#lvlist').onclick = e => { const b = e.target.closest('button'); if (!b) return; $('#levels').classList.remove('show'); loadLevel(+b.dataset.i); };
$('#levels').onclick = e => { if (e.target.id === 'levels') $('#levels').classList.remove('show'); };
window.addEventListener('resize', relayout);

loadLevel(0);
})();
</script>
</body>
