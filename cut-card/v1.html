<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thẻ Cắt · Prototype</title>
<style>
  :root {
    --bg: #f3ebe0; --panel: #fffaf3; --ink: #2d2420; --muted: #7a6a60; --line: #e2d4c4;
    --accent: #c4563f; --ok: #3f8f5a; --board: #e9d2ae; --board-line: #d8bd93;
    --tray: #8a5a3b; --tray-cell: #f6e7cf; --rice: #fffdf7; --rice-edge: #b9a487;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1916; --panel: #29231f; --ink: #f1e8df; --muted: #b3a397; --line: #3d342e;
      --accent: #ef8a6f; --ok: #6cc28a; --board: #5a4632; --board-line: #6b553e;
      --tray: #b98258; --tray-cell: #3a2f27; --rice: #f7f1e6; --rice-edge: #9c8a73;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; padding: 8px 12px 10px; gap: 8px; }
  header { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .title { font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; }
  .title a { color: var(--muted); text-decoration: none; font-weight: 400; margin-right: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 7px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .lv button { padding: 6px 11px; }
  .hint { font-size: .88rem; color: var(--muted); min-height: 2.4em; line-height: 1.25; }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  svg#board { width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
  .hand { display: flex; gap: 8px; justify-content: center; min-height: 96px; touch-action: none; }
  .card { width: 82px; height: 96px; border-radius: 10px; background: var(--panel); border: 2px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;
    touch-action: none; cursor: grab; transition: transform .15s, opacity .15s; box-shadow: 0 2px 4px rgba(0,0,0,.12); }
  .card svg { width: 60px; height: 60px; transition: transform .18s; }
  .card .nm { font-size: .72rem; color: var(--muted); }
  .card .rot { position: absolute; top: 3px; right: 5px; font-size: .8rem; color: var(--muted); }
  .card.dragging { opacity: .25; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .tools { display: flex; gap: 8px; }
  .tools button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: inherit; font-size: .95rem; cursor: pointer; }
  .stats { font-size: .78rem; color: var(--muted); text-align: center; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .box { background: var(--panel); border-radius: 14px; padding: 20px; max-width: 340px; width: 100%; text-align: center; }
  .box h2 { margin: 0 0 6px; }
  .box p { margin: 4px 0; color: var(--muted); }
  .box button { margin-top: 12px; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <div class="title"><a href="./">←</a>Thẻ Cắt v1</div>
      <div class="seg" id="modeSeg">
        <button data-mode="edge">Theo cạnh</button>
        <button data-mode="cell">Theo ô</button>
      </div>
    </div>
    <div class="row">
      <div class="seg lv" id="lvSeg"></div>
    </div>
    <div class="hint" id="hint"></div>
  </header>
  <div class="stage"><svg id="board"></svg></div>
  <div class="hand" id="hand"></div>
  <div class="tools">
    <button id="undoBtn">↶ Hoàn tác</button>
    <button id="resetBtn">⟲ Chơi lại</button>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="overlay" id="win">
  <div class="box">
    <h2>Hoàn thành! 🍱</h2>
    <p id="winInfo"></p>
    <button id="nextBtn">Màn tiếp</button>
  </div>
</div>

<script>
/* ===================== Dữ liệu level =====================
   Toạ độ theo ô, y hướng xuống.
   Thẻ cạnh: polys = danh sách đường gấp khúc, mỗi điểm là giao điểm lưới.
   Thẻ ô: cells = danh sách ô sẽ tách ra.
   Cả hai chế độ dùng chung cơm + khay để so sánh trực tiếp. */
const rect = (w, h) => { const c = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) c.push([x, y]); return c; };
const LINE = n => ({ kind: 'edge', name: `Thẳng ${n}`, polys: [[[0, 0], [n, 0]]] });
const LCUT = { kind: 'edge', name: 'Chữ L', polys: [[[2, 0], [2, 1], [0, 1]]] };
const OCUT = { kind: 'edge', name: 'Chữ O', polys: [[[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]]] };
const CELLS = (name, cells) => ({ kind: 'cell', name, cells });

const LEVELS = [
  { name: 'Nhát đầu tiên', rice: [rect(2, 3)], trays: [rect(2, 2), rect(2, 1)],
    hint: { edge: 'Kéo thẻ đường cắt lên miếng cơm. Đường đỏ hiện ra trước khi thả.', cell: 'Kéo thẻ lên miếng cơm. Các ô cam sẽ được tách ra.' },
    edge: [LINE(2)], cell: [CELLS('2 ô', rect(2, 1))] },
  { name: 'Xoay thẻ', rice: [rect(3, 3)], trays: [rect(2, 2), rect(1, 2), rect(3, 1)],
    hint: { edge: 'Chạm vào thẻ (không kéo) để xoay 90°.', cell: 'Chạm vào thẻ (không kéo) để xoay 90°.' },
    edge: [LINE(3), LINE(2)], cell: [CELLS('3 ô', rect(3, 1)), CELLS('2 ô', rect(2, 1))] },
  { name: 'Chữ L', rice: [rect(3, 3)], trays: [rect(2, 1), rect(1, 3), rect(2, 2)],
    hint: { edge: 'Đường chữ L cắt được góc. Thứ tự dùng thẻ quan trọng.', cell: 'Thứ tự dùng thẻ quan trọng.' },
    edge: [LCUT, LINE(2)], cell: [CELLS('2 ô', rect(2, 1)), CELLS('3 ô', rect(3, 1))] },
  { name: 'Bánh vòng', rice: [rect(3, 3)], trays: [rect(1, 1), rect(3, 1), [[0, 0], [2, 0], [0, 1], [1, 1], [2, 1]]],
    hint: { edge: 'Đường chữ O khép kín: lấy ra đúng phần bên trong.', cell: 'Lấy ô ở giữa ra trước.' },
    edge: [OCUT, LINE(3)], cell: [CELLS('1 ô', rect(1, 1)), CELLS('3 ô', rect(3, 1))] },
];

/* ===================== Bố cục thế giới ===================== */
const COLS = 9, TRAY_Y = 1, BOARD_Y = 5, BOARD_H = 6, ROWS = BOARD_Y + BOARD_H;
const PASTEL = ['#fde2c8', '#d8ecd2', '#d6e4f5', '#f5d6e2', '#efe5c2', '#e2d8f2', '#cfeee9', '#f6d9c8'];

let mode = 'edge', levelIdx = 0;
let pieces = [], hand = [], trayCells = new Set(), trayShapes = [];
let history = [], nextId = 1, colorIdx = 0;
let stats = { cuts: 0, bad: 0, start: 0 };
let drag = null;          // kéo miếng cơm hoặc thẻ

const key = (x, y) => x + ',' + y;
const svg = document.getElementById('board');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

function loadLevel(i) {
  levelIdx = i;
  const L = LEVELS[i];
  // khay: xếp ngang, căn giữa
  const widths = L.trays.map(s => Math.max(...s.map(c => c[0])) + 1);
  let x = Math.floor((COLS - (widths.reduce((a, b) => a + b, 0) + (widths.length - 1))) / 2);
  trayCells = new Set(); trayShapes = [];
  L.trays.forEach((s, t) => {
    const cells = s.map(([cx, cy]) => [cx + x, cy + TRAY_Y]);
    cells.forEach(c => trayCells.add(key(...c)));
    trayShapes.push(cells);
    x += widths[t] + 1;
  });
  // cơm: giữa thớt
  pieces = []; nextId = 1; colorIdx = 0;
  L.rice.forEach(s => {
    const w = Math.max(...s.map(c => c[0])) + 1, h = Math.max(...s.map(c => c[1])) + 1;
    const ox = Math.floor((COLS - w) / 2), oy = BOARD_Y + Math.floor((BOARD_H - h) / 2);
    pieces.push(newPiece(s.map(([cx, cy]) => [cx + ox, cy + oy])));
  });
  hand = L[mode].map(c => ({ def: c, rot: 0, used: false }));
  history = []; stats = { cuts: 0, bad: 0, start: performance.now() };
  document.getElementById('hint').textContent = `${i + 1}. ${L.name} — ${L.hint[mode]}`;
  document.querySelectorAll('#lvSeg button').forEach((b, j) => b.classList.toggle('on', j === i));
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('win').classList.remove('show');
  render(); renderHand();
}
function newPiece(cells) { return { id: nextId++, cells, color: PASTEL[(colorIdx++) % PASTEL.length] }; }

/* ===================== Hình học thẻ ===================== */
function rotPoints(pts, rot) {   // xoay giao điểm lưới 90° cw rot lần
  let p = pts.map(q => q.slice());
  for (let r = 0; r < rot; r++) p = p.map(([x, y]) => [-y, x]);
  return p;
}
function cardGeom(card) {        // trả về hình đã xoay + chuẩn hoá về góc (0,0)
  const d = card.def;
  if (d.kind === 'edge') {
    let polys = d.polys.map(pl => rotPoints(pl, card.rot));
    const all = polys.flat();
    const mx = Math.min(...all.map(p => p[0])), my = Math.min(...all.map(p => p[1]));
    polys = polys.map(pl => pl.map(([x, y]) => [x - mx, y - my]));
    const f = polys.flat();
    return { kind: 'edge', polys, w: Math.max(...f.map(p => p[0])), h: Math.max(...f.map(p => p[1])) };
  }
  let cells = d.cells.map(c => c.slice());
  for (let r = 0; r < card.rot; r++) cells = cells.map(([x, y]) => [-y - 1, x]);
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  cells = cells.map(([x, y]) => [x - mx, y - my]);
  return { kind: 'cell', cells, w: Math.max(...cells.map(c => c[0])) + 1, h: Math.max(...cells.map(c => c[1])) + 1 };
}
function unitSegments(polys, ox, oy) {   // tách đường thành cạnh đơn vị
  const segs = [];
  polys.forEach(pl => {
    for (let i = 0; i < pl.length - 1; i++) {
      let [x1, y1] = pl[i], [x2, y2] = pl[i + 1];
      const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
      while (x1 !== x2 || y1 !== y2) {
        const nx = x1 + dx, ny = y1 + dy;
        segs.push([x1 + ox, y1 + oy, nx + ox, ny + oy]);
        x1 = nx; y1 = ny;
      }
    }
  });
  return segs;
}
function edgeKeySet(segs) {   // h:x,y = cạnh ngang trên ô (x,y); v:x,y = cạnh dọc trái ô (x,y)
  const s = new Set();
  segs.forEach(([x1, y1, x2, y2]) => {
    if (y1 === y2) s.add('h' + key(Math.min(x1, x2), y1)); else s.add('v' + key(x1, Math.min(y1, y2)));
  });
  return s;
}
function components(cells, blocked) {   // các vùng liền nhau khi bỏ cạnh bị cắt
  const set = new Set(cells.map(c => key(...c))), seen = new Set(), out = [];
  for (const c of cells) {
    const k0 = key(...c); if (seen.has(k0)) continue;
    const comp = [], st = [c]; seen.add(k0);
    while (st.length) {
      const [x, y] = st.pop(); comp.push([x, y]);
      const nb = [[x + 1, y, 'v' + key(x + 1, y)], [x - 1, y, 'v' + key(x, y)], [x, y + 1, 'h' + key(x, y + 1)], [x, y - 1, 'h' + key(x, y)]];
      for (const [nx, ny, ek] of nb) {
        const nk = key(nx, ny);
        if (set.has(nk) && !seen.has(nk) && !(blocked && blocked.has(ek))) { seen.add(nk); st.push([nx, ny]); }
      }
    }
    out.push(comp);
  }
  return out;
}

/* Tính kết quả nếu thả thẻ tại (ox,oy). Trả về {valid, splits:[{piece, parts}], segs, cells} */
function evaluateCut(card, ox, oy) {
  const g = cardGeom(card);
  if (g.kind === 'edge') {
    const segs = unitSegments(g.polys, ox, oy), ek = edgeKeySet(segs), splits = [];
    pieces.forEach(p => { const parts = components(p.cells, ek); if (parts.length > 1) splits.push({ piece: p, parts }); });
    return { valid: splits.length > 0, splits, segs };
  }
  const cells = g.cells.map(([x, y]) => [x + ox, y + oy]);
  const owner = new Set(cells.map(c => pieceAt(...c)?.id));
  const p = pieces.find(q => q.id === [...owner][0]);
  if (owner.size !== 1 || !p || cells.length >= p.cells.length) return { valid: false, splits: [], cells };
  const cut = new Set(cells.map(c => key(...c)));
  const rest = p.cells.filter(c => !cut.has(key(...c)));
  return { valid: true, splits: [{ piece: p, parts: [cells, ...components(rest)] }], cells };
}
function pieceAt(x, y) { return pieces.find(p => p.cells.some(c => c[0] === x && c[1] === y)); }

function applyCut(res) {
  pushHistory();
  res.splits.forEach(({ piece, parts }) => {
    const i = pieces.indexOf(piece);
    const np = parts.map((cells, j) => j === 0 ? { ...piece, cells } : newPiece(cells));
    pieces.splice(i, 1, ...np);
  });
}

/* ===================== Đặt miếng cơm ===================== */
const inBoard = (x, y) => x >= 0 && x < COLS && y >= BOARD_Y && y < BOARD_Y + BOARD_H;
function canPlace(piece, cells) {
  const occ = new Set();
  pieces.forEach(p => { if (p !== piece) p.cells.forEach(c => occ.add(key(...c))); });
  return cells.every(([x, y]) => !occ.has(key(x, y)) && (inBoard(x, y) || trayCells.has(key(x, y))));
}
function checkWin() {
  const occ = new Set(); pieces.forEach(p => p.cells.forEach(c => occ.add(key(...c))));
  if (![...trayCells].every(k => occ.has(k))) return;
  const t = ((performance.now() - stats.start) / 1000).toFixed(1);
  document.getElementById('winInfo').textContent =
    `Chế độ: ${mode === 'edge' ? 'theo cạnh' : 'theo ô'} · ${t}s · ${stats.cuts} nhát cắt · ${stats.bad} lần thả hỏng`;
  document.getElementById('nextBtn').textContent = levelIdx < LEVELS.length - 1 ? 'Màn tiếp' : 'Chơi lại từ màn 1';
  setTimeout(() => { document.getElementById('win').classList.add('show'); sfx('win'); }, 250);
}

/* ===================== Lịch sử ===================== */
function pushHistory() {
  history.push({ pieces: pieces.map(p => ({ ...p, cells: p.cells.map(c => c.slice()) })), hand: hand.map(h => ({ ...h })) });
}
function undo() {
  const s = history.pop(); if (!s) return;
  pieces = s.pieces; hand = s.hand; render(); renderHand();
}

/* ===================== Vẽ ===================== */
let lastCut = null;
function render() {
  svg.innerHTML = '';
  const pad = 0.25;
  svg.setAttribute('viewBox', `${-pad} ${-pad} ${COLS + pad * 2} ${ROWS + pad * 2}`);
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  // thớt
  el('rect', { x: -0.1, y: BOARD_Y - 0.1, width: COLS + 0.2, height: BOARD_H + 0.2, rx: 0.35, fill: v('--board') }, svg);
  for (let x = 1; x < COLS; x++) el('line', { x1: x, y1: BOARD_Y, x2: x, y2: BOARD_Y + BOARD_H, stroke: v('--board-line'), 'stroke-width': 0.03 }, svg);
  for (let y = BOARD_Y + 1; y < BOARD_Y + BOARD_H; y++) el('line', { x1: 0, y1: y, x2: COLS, y2: y, stroke: v('--board-line'), 'stroke-width': 0.03 }, svg);
  // khay
  trayShapes.forEach(cells => {
    cells.forEach(([x, y]) => el('rect', { x: x + 0.04, y: y + 0.04, width: 0.92, height: 0.92, rx: 0.12, fill: v('--tray-cell'), stroke: v('--tray'), 'stroke-width': 0.05, 'stroke-dasharray': '0.12 0.08' }, svg));
    outline(cells, v('--tray'), 0.09, svg, -0.06);
  });
  // cơm
  const g = el('g', {}, svg);
  pieces.forEach(p => {
    if (drag && drag.type === 'piece' && drag.piece === p) return;
    drawPiece(p, g, 0, 0, v);
  });
  // xem trước nhát cắt
  if (drag && drag.type === 'card' && drag.res) drawPreview(drag.res, v);
  // miếng đang kéo (vẽ trên cùng)
  if (drag && drag.type === 'piece') {
    const dg = el('g', { opacity: 0.92 }, svg);
    drawPiece(drag.piece, dg, drag.fx, drag.fy, v, true);
    const snapped = drag.piece.cells.map(([x, y]) => [x + Math.round(drag.fx), y + Math.round(drag.fy)]);
    const ok = canPlace(drag.piece, snapped);
    snapped.forEach(([x, y]) => el('rect', { x: x + 0.1, y: y + 0.1, width: 0.8, height: 0.8, rx: 0.15, fill: 'none', stroke: ok ? v('--ok') : v('--accent'), 'stroke-width': 0.06 }, svg));
  }
  if (lastCut) {   // vệt chém ngắn
    lastCut.forEach(([x1, y1, x2, y2]) => {
      const ln = el('line', { x1, y1, x2, y2, stroke: '#fff', 'stroke-width': 0.14, 'stroke-linecap': 'round' }, svg);
      ln.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' });
    });
    lastCut = null;
  }
}
function drawPiece(p, parent, dx, dy, v, lifted) {
  const gg = el('g', { transform: `translate(${dx} ${dy})` }, parent);
  if (lifted) el('g', {}, gg);
  p.cells.forEach(([x, y]) => el('rect', { x: x + 0.02, y: y + 0.02, width: 0.96, height: 0.96, fill: p.color }, gg));
  p.cells.forEach(([x, y]) => el('rect', { x: x + 0.14, y: y + 0.14, width: 0.72, height: 0.72, rx: 0.2, fill: v('--rice'), opacity: 0.85 }, gg));
  outline(p.cells, v('--rice-edge'), 0.07, gg, 0);
}
function outline(cells, color, w, parent, inset) {
  const s = new Set(cells.map(c => key(...c)));
  cells.forEach(([x, y]) => {
    const a = inset;
    if (!s.has(key(x, y - 1))) el('line', { x1: x, y1: y - a, x2: x + 1, y2: y - a, stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
    if (!s.has(key(x, y + 1))) el('line', { x1: x, y1: y + 1 + a, x2: x + 1, y2: y + 1 + a, stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
    if (!s.has(key(x - 1, y))) el('line', { x1: x - a, y1: y, x2: x - a, y2: y + 1, stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
    if (!s.has(key(x + 1, y))) el('line', { x1: x + 1 + a, y1: y, x2: x + 1 + a, y2: y + 1, stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
  });
}
const PART_TINT = ['rgba(196,86,63,.35)', 'rgba(63,120,196,.35)', 'rgba(63,160,90,.35)', 'rgba(200,160,40,.4)'];
function drawPreview(res, v) {
  res.splits.forEach(({ parts }) => parts.forEach((cells, i) =>
    cells.forEach(([x, y]) => el('rect', { x, y, width: 1, height: 1, fill: PART_TINT[i % PART_TINT.length] }, svg))));
  if (res.segs) res.segs.forEach(([x1, y1, x2, y2]) =>
    el('line', { x1, y1, x2, y2, stroke: res.valid ? '#d6332a' : '#8a8a8a', 'stroke-width': 0.13, 'stroke-linecap': 'round', 'stroke-dasharray': res.valid ? '' : '0.18 0.12' }, svg));
  if (res.cells) res.cells.forEach(([x, y]) =>
    el('rect', { x: x + 0.08, y: y + 0.08, width: 0.84, height: 0.84, rx: 0.15, fill: res.valid ? 'rgba(230,120,30,.55)' : 'rgba(130,130,130,.45)', stroke: res.valid ? '#d06a10' : '#777', 'stroke-width': 0.06 }, svg));
}

/* ===================== Tay bài ===================== */
const handEl = document.getElementById('hand');
function cardSVG(card) {
  const g = cardGeom(card), size = 4, s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', `-0.5 -0.5 ${size} ${size}`);
  const ox = (size - 1 - g.w) / 2, oy = (size - 1 - g.h) / 2;
  for (let i = 0; i <= 3; i++) {
    el('line', { x1: i, y1: 0, x2: i, y2: 3, stroke: '#d9cbb8', 'stroke-width': 0.04 }, s);
    el('line', { x1: 0, y1: i, x2: 3, y2: i, stroke: '#d9cbb8', 'stroke-width': 0.04 }, s);
  }
  if (g.kind === 'edge') {
    g.polys.forEach(pl => el('polyline', { points: pl.map(([x, y]) => `${x + ox},${y + oy}`).join(' '), fill: 'none', stroke: '#d6332a', 'stroke-width': 0.22, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s));
  } else {
    g.cells.forEach(([x, y]) => el('rect', { x: x + ox + 0.06, y: y + oy + 0.06, width: 0.88, height: 0.88, rx: 0.15, fill: '#f0a050', stroke: '#c46a10', 'stroke-width': 0.06 }, s));
  }
  return s;
}
function renderHand() {
  handEl.innerHTML = '';
  hand.forEach((c, i) => {
    if (c.used) return;
    const d = document.createElement('div');
    d.className = 'card'; d.dataset.i = i;
    d.appendChild(cardSVG(c));
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = c.def.name; d.appendChild(nm);
    const r = document.createElement('div'); r.className = 'rot'; r.textContent = '↻'; d.appendChild(r);
    d.addEventListener('pointerdown', e => cardDown(e, i, d));
    handEl.appendChild(d);
  });
  if (!hand.some(c => !c.used)) {
    const p = document.createElement('div'); p.className = 'hint'; p.style.alignSelf = 'center';
    p.textContent = 'Hết thẻ. Kéo các miếng vào khay, hoặc Hoàn tác.'; handEl.appendChild(p);
  }
  updateStats();
}
function updateStats() {
  document.getElementById('stats').textContent =
    `Thẻ còn ${hand.filter(c => !c.used).length} · Đã cắt ${stats.cuts} · Thả hỏng ${stats.bad}`;
}

/* ===================== Điều khiển ===================== */
function toWorld(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const w = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [w.x, w.y];
}
const TAP_PX = e => e.pointerType === 'touch' ? 12 : 5;

function cardDown(e, i, d) {
  e.preventDefault();
  try { d.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { type: 'card', i, d, sx: e.clientX, sy: e.clientY, moved: false, res: null, touch: e.pointerType === 'touch', pid: e.pointerId };
}
svg.addEventListener('pointerdown', e => {
  if (drag) return;
  const [wx, wy] = toWorld(e), p = pieceAt(Math.floor(wx), Math.floor(wy));
  if (!p) return;
  e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { type: 'piece', piece: p, sx: wx, sy: wy, fx: 0, fy: 0, pid: e.pointerId, touch: e.pointerType === 'touch' };
  render();
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (drag.type === 'piece') {
    const [wx, wy] = toWorld(e);
    drag.fx = wx - drag.sx; drag.fy = wy - drag.sy - (drag.touch ? 0 : 0);
    render(); return;
  }
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < TAP_PX(e)) return;
  drag.moved = true; drag.d.classList.add('dragging');
  const card = hand[drag.i], g = cardGeom(card);
  let [wx, wy] = toWorld(e);
  if (drag.touch) wy -= 1.3;   // nhấc lên trên ngón tay cho dễ nhìn
  const ox = Math.round(wx - g.w / 2), oy = Math.round(wy - g.h / 2);
  if (!drag.res || drag.ox !== ox || drag.oy !== oy) {
    drag.ox = ox; drag.oy = oy; drag.res = evaluateCut(card, ox, oy);
    render();
  }
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag; drag = null;
  if (dr.type === 'piece') {
    const dx = Math.round(dr.fx), dy = Math.round(dr.fy);
    const cells = dr.piece.cells.map(([x, y]) => [x + dx, y + dy]);
    if (!cancelled && (dx || dy) && canPlace(dr.piece, cells)) {
      pushHistory();
      const p = pieces.find(q => q.id === dr.piece.id); p.cells = cells;
      sfx('drop'); render(); checkWin();
    } else render();
    return;
  }
  dr.d.classList.remove('dragging');
  if (cancelled) { render(); return; }
  if (!dr.moved) {   // chạm = xoay
    pushHistory(); hand[dr.i].rot = (hand[dr.i].rot + 1) % 4; sfx('rot'); renderHand(); return;
  }
  if (dr.res && dr.res.valid) {
    applyCut(dr.res);
    hand[dr.i].used = true; stats.cuts++;
    lastCut = dr.res.segs || cellBoundarySegs(dr.res.cells);
    sfx('cut'); render(); renderHand(); checkWin();
  } else {
    stats.bad++; render(); renderHand();
    const card = handEl.querySelector(`.card[data-i="${dr.i}"]`); if (card) card.classList.add('shake');
    sfx('bad');
  }
}
function cellBoundarySegs(cells) {
  const s = new Set(cells.map(c => key(...c))), out = [];
  cells.forEach(([x, y]) => {
    if (!s.has(key(x, y - 1))) out.push([x, y, x + 1, y]);
    if (!s.has(key(x, y + 1))) out.push([x, y + 1, x + 1, y + 1]);
    if (!s.has(key(x - 1, y))) out.push([x, y, x, y + 1]);
    if (!s.has(key(x + 1, y))) out.push([x + 1, y, x + 1, y + 1]);
  });
  return out;
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ===================== Âm thanh ===================== */
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    if (kind === 'cut') {   // tiếng chém: nhiễu ngắn qua lọc
      const len = 0.12, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; g.gain.value = 0.6;
      src.connect(f).connect(g).connect(ac.destination); src.start(t);
      return;
    }
    const o = ac.createOscillator(), g = ac.createGain();
    const map = { drop: [520, 0.06], rot: [700, 0.05], bad: [160, 0.15], win: [880, 0.3] };
    const [fq, du] = map[kind] || [440, 0.05];
    o.frequency.value = fq; o.type = kind === 'bad' ? 'square' : 'sine';
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + du);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + du);
  } catch (_) {}
}

/* ===================== Khởi động ===================== */
const lvSeg = document.getElementById('lvSeg');
LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.onclick = () => loadLevel(i); lvSeg.appendChild(b); });
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  try { localStorage.setItem('cutcard-mode', mode); } catch (_) {}
  loadLevel(levelIdx);
});
document.getElementById('undoBtn').onclick = undo;
document.getElementById('resetBtn').onclick = () => loadLevel(levelIdx);
document.getElementById('nextBtn').onclick = () => loadLevel((levelIdx + 1) % LEVELS.length);
try { const m = localStorage.getItem('cutcard-mode'); if (m === 'edge' || m === 'cell') mode = m; } catch (_) {}
window.addEventListener('resize', render);
loadLevel(0);

/* Kiểm tra lời giải cho cả 2 chế độ (gọi trong console: selfTest()) */
window.selfTest = function () {
  const out = [];
  for (const m of ['edge', 'cell']) for (let i = 0; i < LEVELS.length; i++) {
    mode = m; loadLevel(i);
    out.push(`${m} ${i + 1}: ${solve() ? 'giải được' : 'KHÔNG giải được'}`);
  }
  mode = 'edge'; loadLevel(0);
  return out;
};
function solve() {   // thử mọi thứ tự thẻ × xoay × vị trí, rồi kiểm tra các miếng xếp kín khay
  const rec = () => {
    const left = hand.map((c, i) => i).filter(i => !hand[i].used);
    if (!left.length) return fitsTrays();
    for (const i of left) for (let r = 0; r < 4; r++) {
      hand[i].rot = r;
      for (let ox = -1; ox <= COLS; ox++) for (let oy = BOARD_Y - 1; oy <= ROWS; oy++) {
        const res = evaluateCut(hand[i], ox, oy); if (!res.valid) continue;
        const save = pieces.map(p => ({ ...p, cells: p.cells.map(c => c.slice()) }));
        applyCut(res); hand[i].used = true;
        if (rec()) return true;
        pieces = save; hand[i].used = false; history.pop();
      }
    }
    return false;
  };
  return rec();
}
function fitsTrays() {   // các miếng (cho phép xoay? không — chỉ dịch) phủ kín các khay
  const shapes = pieces.map(p => p.cells), norm = cells => {
    const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
    return cells.map(([x, y]) => key(x - mx, y - my)).sort().join('|');
  };
  const trays = trayShapes.map(norm).sort(), got = shapes.map(norm).sort();
  return trays.length === got.length && trays.every((t, i) => t === got[i]);
}
