<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #7A6252; --cream: #FFF6E6; --wood-ink: #96623C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2c211d; font-family: Nunito, "Segoe UI", system-ui, sans-serif; overscroll-behavior: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 8px 10px; color: #f6eadb; }
  .dev { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 100vw; font-size: .8rem; font-weight: 800; }
  @media (max-width: 480px) { .dev .note { display: none; } }
  .dev button, .dev select { font: inherit; background: #3a2c26; color: #f6eadb; border: 2px solid #5a4338; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .frame { flex: none; width: min(390px, 100%, calc((100vh - 60px) * 390 / 844)); aspect-ratio: 390 / 844; border-radius: 30px; overflow: hidden;
    box-shadow: 0 0 0 6px #120d0b, 0 18px 40px rgba(0,0,0,.5); position: relative; }
  @media (max-width: 480px) { .wrap { padding: 0; gap: 0; } .dev { padding: 6px; } .frame { border-radius: 0; box-shadow: none; width: min(100vw, calc((100vh - 44px) * 390 / 844)); } }
  .stage { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; background: #F3E9DA; overflow: hidden; touch-action: none; }
  .abs { position: absolute; }
  .stage img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .btn { cursor: pointer; pointer-events: auto !important; transition: transform .08s; }
  .btn:active { transform: translateY(2px) scale(.97); }
  .t { color: var(--cream); font-weight: 900; white-space: nowrap; transform: translate(-50%, -50%); -webkit-text-stroke: 4px var(--wood-ink); paint-order: stroke fill; pointer-events: none; }
  .lbl { color: var(--ink); font-weight: 800; font-size: 11px; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; }
  .board9 { border-style: solid; border-width: 30px 30px 32px 30px; border-image: url(assets/board.png) 60 60 64 60 fill / 30px 30px 32px 30px; }
  svg#board { position: absolute; touch-action: none; overflow: visible; }
  .hint { left: 50%; transform: translateX(-50%); max-width: 280px; text-align: center; padding: 6px 14px; border-radius: 14px; background: rgba(255, 246, 230, .92);
    color: var(--ink); font-size: 12.5px; font-weight: 800; line-height: 1.3; box-shadow: 0 2px 6px rgba(90,60,40,.18); transition: opacity .4s; pointer-events: none; }
  .hint.off { opacity: 0; }
  .hand { left: 76px; width: 300px; height: 116px; border-radius: 22px; background: #E2D4C2; display: flex; align-items: center; justify-content: center; gap: 14px; touch-action: none; }
  .card { position: relative; width: 84px; height: 104px; border-style: solid; border-width: 22px 22px 24px 22px; cursor: grab; touch-action: none; transition: opacity .15s; }
  .card.line { border-image: url(assets/card_line.png) 44 44 48 44 fill / 22px 22px 24px 22px; }
  .card.mold { border-image: url(assets/card_mold.png) 44 44 48 44 fill / 22px 22px 24px 22px; }
  .card.diag { border-image: url(assets/card_diag.png) 44 44 48 44 fill / 22px 22px 24px 22px; }
  .card.fn, .card.glue { border-image: url(assets/card_fn.png) 44 44 48 44 fill / 22px 22px 24px 22px; }
  .card .art { position: absolute; left: -10px; top: -12px; width: 60px; height: 60px; }
  .card .nm { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .card .rot { position: absolute; right: -16px; top: -16px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1.5px solid #B9A28E; color: #8A6A55;
    font-size: 11px; line-height: 15px; text-align: center; font-weight: 900; }
  .card.dragging { opacity: .25; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .empty { color: var(--ink); font-size: 12px; font-weight: 800; text-align: center; padding: 0 16px; }
  .toast { left: 50%; top: 300px; transform: translate(-50%, -50%); background: rgba(74,42,36,.88); color: #fff; font-size: 13px; font-weight: 800; padding: 8px 14px;
    border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .win { left: 0; top: 0; width: 390px; height: 844px; background: rgba(40,25,18,.32); display: none; }

  /* popup vẽ bằng CSS cùng màu ảnh popup.png: kéo giãn 9-slice quá nhiều theo chiều dọc làm lộ đường nối giữa các mảnh */
  .pop { left: 45px; top: 287px; width: 300px; height: 270px; border-radius: 26px; background: #FDF4E8;
    border: 3px solid #DFCCB2; box-shadow: inset 0 0 0 3px #F3E8DA, 0 4px 0 #D9C6AA, 0 10px 24px rgba(60,35,20,.25); }

<body>

<script>
/* =========================================================================
   Luật chơi và màn chơi giữ nguyên prototype v4. Chỉ thay phần vẽ bằng bộ asset
   phong cách C (Canva) và bố cục mockup v3.
   Mô hình: mỗi ô chia thành 4 tam giác  t = 0 trên, 1 phải, 2 dưới, 3 trái.
   Cạnh cắt: h x,y (ngang trên ô), v x,y (dọc trái ô), d x,y (chéo "\"), a x,y (chéo "/").
   ========================================================================= */
const T4 = [0, 1, 2, 3];
const R = (w, h) => { const c = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) c.push([x, y]); return c; };
const full = cells => cells.flatMap(([x, y]) => T4.map(t => [x, y, t]));

const LINE  = n => ({ fam: 'line', name: `Thẳng ${n}`, polys: [[[0, 0], [n, 0]]] });
const LINEV = n => ({ fam: 'line', name: `Thẳng ${n}`, polys: [[[0, 0], [0, n]]] });
const LCUT  = { fam: 'line', name: 'Chữ L', polys: [[[2, 0], [2, 1], [0, 1]]] };
const TCUT  = { fam: 'line', name: 'Chữ T', polys: [[[0, 0], [2, 0]], [[1, 0], [1, 1]]] };
const MOLD2 = { fam: 'mold', name: 'Khuôn 2×2', polys: [[[0, 0], [2, 0], [2, 2], [0, 2], [0, 0]]] };
const DIAG  = n => ({ fam: 'diag', name: `Chéo ${n}`, polys: [[[0, 0], [n, n]]] });
const DIAGA = n => ({ fam: 'diag', name: `Chéo ${n}`, polys: [[[n, 0], [0, n]]] });
const FN_ROT  = { fam: 'fn', kind: 'rot', name: 'Xoay', icon: 'icon_rotate' };
const FN_FLIP = { fam: 'fn', kind: 'flip', name: 'Lật', icon: 'icon_flip' };
const FN_COPY = { fam: 'fn', kind: 'copy', name: 'Nhân bản', icon: 'icon_copy' };
const FN_GLUE = { fam: 'glue', kind: 'glue', name: 'Dán', icon: 'icon_glue', polys: [[[0, 0], [1, 0]]] };

const DIAMOND = [[1, 0, 1], [1, 0, 2], [0, 1, 1], [0, 1, 2], ...full([[1, 1]]), [2, 0, 2], [2, 0, 3], ...full([[2, 1]]), [3, 1, 2], [3, 1, 3],
                 [0, 2, 0], [0, 2, 1], ...full([[1, 2]]), [1, 3, 0], [1, 3, 1], ...full([[2, 2]]), [3, 2, 0], [3, 2, 3], [2, 3, 0], [2, 3, 3]];
const LEVELS = [
  { hint: 'Kéo thẻ lên cơm để cắt, rồi ráp các miếng cho kín hộp.',
    rice: [{ s: full(R(4, 1)), at: [1, 7] }], tray: { s: full(R(2, 2)), at: [2, 1] }, cards: [LINEV(1)] },
  { hint: 'Hộp lệch bậc thang. Chạm thẻ để xoay thẻ nếu cần.',
    rice: [{ s: full(R(3, 2)), at: [2, 6] }], tray: { s: full([[0, 0], [1, 0], [2, 0], [1, 1], [2, 1], [3, 1]]), at: [1, 1] }, cards: [LINE(3)] },
  { hint: 'Đường chữ L cắt góc. Ráp phần góc vào chỗ còn thiếu.',
    rice: [{ s: full(R(3, 3)), at: [2, 6] }], tray: { s: full([[2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2], [0, 3], [1, 3]]), at: [2, 0] }, cards: [LCUT] },
  { hint: 'Hộp có sẵn trứng ốp la. Lấp cơm quanh món có sẵn.',
    rice: [{ s: full(R(5, 1)), at: [1, 7] }], tray: { s: full(R(3, 2)), at: [2, 1], fixed: [{ kind: 'egg', cells: [[1, 0]] }] }, cards: [LINEV(1), LINEV(1)] },
  { hint: 'Hộp có vách ngăn (vạch đậm): miếng cơm không được nằm vắt qua vách.',
    rice: [{ s: full(R(2, 3)), at: [2, 6] }], tray: { s: full(R(3, 2)), at: [2, 1], walls: [[1, 0, 1, 2]] }, cards: [LINE(2), LINEV(1)] },
  { hint: 'Miếng cơm không tự xoay được. Kéo thẻ Xoay lên miếng cơm. Chạm thẻ để đổi chiều.',
    rice: [{ s: full(R(3, 2)), at: [2, 7] }], tray: { s: full(R(2, 3)), at: [2, 1] }, cards: [FN_ROT] },
  { hint: 'Xoay mấy cũng không vừa? Thẻ Lật soi gương miếng cơm. Chạm thẻ để đổi ngang / dọc.',
    rice: [{ s: full([[1, 0], [2, 0], [0, 1], [1, 1]]), at: [2, 7] }], tray: { s: full([[0, 0], [1, 0], [1, 1], [2, 1]]), at: [2, 1] }, cards: [FN_FLIP] },
  { hint: 'Thẻ chữ T chia miếng cơm thành 3 phần.',
    rice: [{ s: full(R(2, 2)), at: [2, 7] }], tray: { s: full([[0, 0], [1, 0], [1, 1], [1, 2]]), at: [2, 1] }, cards: [TCUT] },
  { hint: 'Khuôn 2×2 lấy ra đúng một khối vuông. Hộp có sẵn xúc xích.',
    rice: [{ s: full(R(4, 2)), at: [1, 7] }],
    tray: { s: full([[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2], [1, 2], [2, 2], [3, 2]]), at: [1, 1], fixed: [{ kind: 'sausage', cells: [[1, 2], [2, 2]] }] },
    cards: [MOLD2] },
  { hint: 'Chỉ có 1 thẻ Xoay mà cần xoay 2 miếng? Đặt 2 miếng sát nhau, Dán lên đường nối, rồi xoay cả khối.',
    rice: [{ s: full(R(3, 1)), at: [1, 6] }, { s: full(R(3, 1)), at: [3, 8] }], tray: { s: full(R(2, 3)), at: [2, 1] }, cards: [FN_GLUE, FN_ROT] },
  { hint: 'Thẻ Nhân bản tạo thêm một miếng giống hệt (miếng tối đa 2 ô).',
    rice: [{ s: full(R(2, 1)), at: [2, 7] }], tray: { s: full(R(3, 2)), at: [2, 1], fixed: [{ kind: 'meat', cells: [[2, 0], [2, 1]] }] }, cards: [FN_COPY] },
  { hint: 'Hộp hình viên kẹo ◇. Thẻ chéo hai hướng là chìa khoá.',
    rice: [{ s: full(R(4, 2)), at: [1, 7] }], tray: { s: DIAMOND, at: [1, 1] }, cards: [LINEV(2), DIAGA(2), DIAG(2)] },
];

/* ======================= Bố cục màn hình (px, khung 390×844) ======================= */
const COLS = 7, ROWS = 10, CPX = 40, OPX = 12, BX = 43, BY = 150;
const BW = COLS * CPX + 2 * OPX, BH = ROWS * CPX + 2 * OPX, PAD = OPX / CPX;
const HY = BY + BH + 8;
const FOOD = { egg: 'food_egg', sausage: 'food_sausage', meat: 'food_pork_belly' };
const TIN = { well: '#B3A396', wellSh: '#8C7F74', wall: '#DACEC3', rim: '#E5D8CD', rimSh: '#C4B8AC', outline: '#968C84' };
const RIM = 9 / CPX;

/* ======================= Trạng thái ======================= */
let levelIdx = 0, foods = [], trays = [], hand = [], history = [], nextId = 1;
let drag = null, lastCut = null, won = false, hintTimer = null;
const key3 = (x, y, t) => x + ',' + y + ',' + t;
const $ = id => document.getElementById(id);
const svg = $('board'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const clone = o => JSON.parse(JSON.stringify(o));
let uid = 0;

function loadLevel(i) {
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  const L = LEVELS[levelIdx], tr = L.tray;
  nextId = 1;
  foods = L.rice.map(r => ({ id: nextId++, tris: r.s.map(([x, y, t]) => [x + r.at[0], y + r.at[1], t]) }));
  trays = [{ id: 100, tris: tr.s.map(([x, y, t]) => [x + tr.at[0], y + tr.at[1], t]),
    walls: (tr.walls || []).map(([x1, y1, x2, y2]) => [x1 + tr.at[0], y1 + tr.at[1], x2 + tr.at[0], y2 + tr.at[1]]),
    fixed: (tr.fixed || []).map(f => ({ kind: f.kind, cells: f.cells.map(([x, y]) => [x + tr.at[0], y + tr.at[1]]) })) }];
  hand = L.cards.map(c => ({ def: c, rot: 0, used: false }));
  history = []; won = false;
  $('lvName').textContent = `Level ${levelIdx + 1}`;
  $('lvSel').value = String(levelIdx);
  showHint(L.hint, 6000);
  $('win').classList.remove('on');
  render(); renderHand();
}
function showHint(text, ms) {
  const h = $('hint'); h.textContent = text; h.classList.remove('off');
  clearTimeout(hintTimer); if (ms) hintTimer = setTimeout(() => h.classList.add('off'), ms);
}
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); }

/* ======================= Hình học (giữ nguyên v4) ======================= */
function cardGeom(card) {
  let polys = card.def.polys.map(pl => pl.map(p => p.slice()));
  for (let r = 0; r < card.rot; r++) polys = polys.map(pl => pl.map(([x, y]) => [-y, x]));
  const all = polys.flat(), mx = Math.min(...all.map(p => p[0])), my = Math.min(...all.map(p => p[1]));
  polys = polys.map(pl => pl.map(([x, y]) => [x - mx, y - my]));
  const f = polys.flat();
  return { polys, w: Math.max(...f.map(p => p[0])), h: Math.max(...f.map(p => p[1])) };
}
function unitSegments(polys, ox, oy) {
  const segs = [];
  polys.forEach(pl => { for (let i = 0; i < pl.length - 1; i++) {
    let [x1, y1] = pl[i]; const [x2, y2] = pl[i + 1], dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1);
    while (x1 !== x2 || y1 !== y2) { segs.push([x1 + ox, y1 + oy, x1 + dx + ox, y1 + dy + oy]); x1 += dx; y1 += dy; }
  } });
  return segs;
}
function segKeys(segs) {
  const s = new Set();
  segs.forEach(([x1, y1, x2, y2]) => {
    const x = Math.min(x1, x2), y = Math.min(y1, y2);
    if (y1 === y2) s.add('h' + x + ',' + y);
    else if (x1 === x2) s.add('v' + x + ',' + y);
    else s.add(((x2 - x1) * (y2 - y1) > 0 ? 'd' : 'a') + x + ',' + y);
  });
  return s;
}
function neighbors(x, y, t) {
  const inCell = [[x, y, (t + 1) % 4, (t % 2 === 0 ? 'a' : 'd') + x + ',' + y],
                  [x, y, (t + 3) % 4, (t % 2 === 0 ? 'd' : 'a') + x + ',' + y]];
  const across = [[x, y - 1, 2, 'h' + x + ',' + y], [x + 1, y, 3, 'v' + (x + 1) + ',' + y],
                  [x, y + 1, 0, 'h' + x + ',' + (y + 1)], [x - 1, y, 1, 'v' + x + ',' + y]][t];
  return [...inCell, across];
}
function edgePairs(k) {
  const c = k[0], [x, y] = k.slice(1).split(',').map(Number);
  if (c === 'h') return [[[x, y - 1, 2], [x, y, 0]]];
  if (c === 'v') return [[[x - 1, y, 1], [x, y, 3]]];
  if (c === 'd') return [[[x, y, 1], [x, y, 2]], [[x, y, 3], [x, y, 0]]];
  return [[[x, y, 0], [x, y, 1]], [[x, y, 2], [x, y, 3]]];
}
function components(tris, blocked) {
  const set = new Set(tris.map(q => key3(...q))), seen = new Set(), out = [];
  for (const q of tris) {
    const k0 = key3(...q); if (seen.has(k0)) continue;
    const comp = [], st = [q]; seen.add(k0);
    while (st.length) {
      const c = st.pop(); comp.push(c);
      for (const [nx, ny, nt, ek] of neighbors(...c)) {
        const nk = key3(nx, ny, nt);
        if (set.has(nk) && !seen.has(nk) && !(blocked && blocked.has(ek))) { seen.add(nk); st.push([nx, ny, nt]); }
      }
    }
    out.push(comp);
  }
  return out;
}
const shift = (tris, dx, dy) => tris.map(([x, y, t]) => [x + dx, y + dy, t]);
function bbox(tris) { const xs = tris.map(q => q[0]), ys = tris.map(q => q[1]); return { minx: Math.min(...xs), maxx: Math.max(...xs), miny: Math.min(...ys), maxy: Math.max(...ys) }; }
const normalize = tris => { const b = bbox(tris); return shift(tris, -b.minx, -b.miny); };
const rotCW = tris => tris.map(([x, y, t]) => [-y - 1, x, (t + 1) % 4]);
const flipH = tris => tris.map(([x, y, t]) => [-x - 1, y, t % 2 ? 4 - t : t]);
const flipV = tris => tris.map(([x, y, t]) => [x, -y - 1, t % 2 ? t : 2 - t]);
const transformFn = (kind, dir, tris) => kind === 'rot' ? (dir ? rotCW(rotCW(rotCW(tris))) : rotCW(tris)) : (dir ? flipV(tris) : flipH(tris));

function evaluateCut(card, ox, oy) {
  const g = cardGeom(card), segs = unitSegments(g.polys, ox, oy), ek = segKeys(segs), splits = [];
  foods.forEach(f => { const parts = components(f.tris, ek); if (parts.length > 1) splits.push({ food: f, parts }); });
  return { kind: 'cut', valid: splits.length > 0, splits, segs };
}
function applyCut(res) {

  if (drag.touch) wy -= 1.3;
  if (card.def.fam === 'fn') { const k = key3(...triAt(wx, wy)); if (drag.k !== k || !drag.res) { drag.k = k; drag.res = evaluateFn(card, wx, wy); } drag.res.point = [wx, wy]; render(); return; }
  const g = cardGeom(card), ox = Math.round(wx - g.w / 2), oy = Math.round(wy - g.h / 2);
  if (!drag.res || drag.ox !== ox || drag.oy !== oy) { drag.ox = ox; drag.oy = oy; drag.res = card.def.fam === 'glue' ? evaluateGlue(card, ox, oy) : evaluateCut(card, ox, oy); render(); }
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag; drag = null;
  if (dr.type === 'food' || dr.type === 'tray') {
    const dx = Math.round(dr.fx), dy = Math.round(dr.fy);
    if (!cancelled && dr.moved && (dx || dy)) {
      if (dr.type === 'food' && canPlaceFood(dr.food, shift(dr.food.tris, dx, dy))) { pushHistory(); dr.food.tris = shift(dr.food.tris, dx, dy); sfx('drop'); }
      else if (dr.type === 'tray' && canPlaceTray(dr.tray, dx, dy)) {
        pushHistory(); foodsInside(dr.tray).forEach(f => f.tris = shift(f.tris, dx, dy)); dr.tray.tris = shift(dr.tray.tris, dx, dy);
        dr.tray.walls = dr.tray.walls.map(([a, b, c, d]) => [a + dx, b + dy, c + dx, d + dy]);
        dr.tray.fixed.forEach(f => f.cells = f.cells.map(([x, y]) => [x + dx, y + dy])); sfx('drop');
      } else sfx('bad');
    }
    render(); checkWin(); return;
  }
  dr.d.classList.remove('dragging');
  if (cancelled) { render(); return; }
  const card = hand[dr.i];
  if (!dr.moved) { if (card.def.kind === 'copy') { render(); return; } pushHistory(); card.rot = (card.rot + 1) % 4; sfx('rot'); renderHand(); return; }
  const res = dr.res;
  if (res && res.valid) {
    pushHistory();
    if (res.kind === 'cut') { applyCut(res); lastCut = { segs: res.segs, color: '#fff' }; sfx('cut'); }
    else if (res.kind === 'glue') { applyGlue(res); lastCut = { segs: res.segs, color: '#9be59b' }; sfx('pop'); }
    else { applyFn(res); sfx('pop'); }
    card.used = true; $('hint').classList.add('off'); renderHand(); checkWin();
  } else {
    if (res && res.why) showHint(res.why, 2500);
    renderHand(); sfx('bad');
    const c = handEl.querySelector(`.card[data-i="${dr.i}"]`); if (c) c.classList.add('shake');
  }
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ======================= Âm thanh ======================= */
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime;
    if (kind === 'cut') { const len = .12, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; g.gain.value = .6;
      src.connect(f).connect(g).connect(ac.destination); src.start(t); return; }
    const o = ac.createOscillator(), g = ac.createGain();
    const [fq, du] = ({ drop: [520, .06], rot: [700, .05], bad: [160, .15], win: [880, .3], pop: [620, .12] })[kind] || [440, .05];
    o.frequency.value = fq; o.type = kind === 'bad' ? 'square' : 'sine'; g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + du);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + du);
  } catch (_) {}
}

/* ======================= Khởi động ======================= */
Object.assign($('boardBg').style, { left: BX + 'px', top: BY + 'px', width: BW + 'px', height: BH + 'px' });
Object.assign(svg.style, { left: BX + 'px', top: BY + 'px', width: BW + 'px', height: BH + 'px' });
$('hand').style.top = HY + 'px'; $('undoBtn').style.top = (HY + 32) + 'px';
const BYB = HY + 116 + 18 + 26;
$('boosters').innerHTML = [['booster_hint', 'Gợi ý'], ['booster_wand', 'Booster 2'], ['booster_locked', 'Lv 15']].map(([n, t], k) =>
  `<img class="abs btn" data-b="${k}" src="assets/${n}.png" style="left:${113 + k * 82 - 26}px;top:${BYB - 26}px;width:52px">
   <div class="abs lbl" style="left:${113 + k * 82}px;top:${BYB + 36}px">${t}</div>`).join('') +
  `<img class="abs" src="assets/badge_red.png" style="left:206px;top:${BYB - 30}px;width:20px"><div class="abs lbl" style="left:216px;top:${BYB - 20}px;color:#fff;font-weight:900">2</div>`;
document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => toast(b.dataset.b === '2' ? 'Mở ở Level 15' : 'Booster chưa chốt (Q-08)'));
$('adsBtn').onclick = () => toast('Gỡ quảng cáo: chưa làm');
LEVELS.forEach((L, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `Level ${i + 1}`; $('lvSel').appendChild(o); });
$('lvSel').onchange = e => loadLevel(+e.target.value);
$('prevLv').onclick = () => loadLevel(levelIdx - 1);
$('nextLv').onclick = () => loadLevel(levelIdx + 1);
$('resetBtn').onclick = () => loadLevel(levelIdx);
$('undoBtn').onclick = undo;
$('nextBtn').onclick = () => loadLevel(levelIdx + 1);
const frame = $('frame'), stage = $('stage');
const fit = () => { stage.style.transform = `scale(${frame.clientWidth / 390})`; };
new ResizeObserver(fit).observe(frame); fit();
loadLevel(+(new URLSearchParams(location.search).get('lv') || 1) - 1);
/* ?win: hiện popup Hoàn thành (để chụp ảnh soát vị trí) */
if (new URLSearchParams(location.search).has('win')) { $('winInfo').textContent = `Level ${levelIdx + 1} xong.`; $('hint').classList.add('off'); $('win').classList.add('on'); }
/* ?cut1: Level 1 sau khi cắt một nhát (để chụp so trước / sau khi cắt) */
if (new URLSearchParams(location.search).has('cut1')) {
  loadLevel(0); const r = evaluateCut(hand[0], 3, 7); if (r.valid) { applyCut(r); hand[0].used = true; }
  $('hint').classList.add('off'); renderHand();
}
/* ?demo: dựng sẵn trạng thái giữa Level 12 (có nửa ô cơm) để chụp ảnh soát hình */
if (new URLSearchParams(location.search).has('demo')) {
  loadLevel(11);
  const cut = (i, ox, oy) => { const r = evaluateCut(hand[i], ox, oy); if (r.valid) { applyCut(r); hand[i].used = true; } };
  cut(0, 3, 7); cut(1, 1, 7); cut(2, 3, 7);
  const half = foods.find(f => f.tris.length === 8 && f.tris.every(q => q[0] === 1 || q[0] === 2) && f.tris.some(q => q[1] === 8 && q[0] === 1 && q[2] === 3));
  if (half) half.tris = shift(half.tris, 0, -5);
  $('hint').classList.add('off'); renderHand();
}
