<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thẻ Cắt · Prototype v4</title>
<style>
  :root {
    --bg: #b7614b; --bg2: #a5513d; --plank: #8c4a33; --plank-hi: #c98a5e; --ui: #4a2a24;
    --board: #c98d63; --board-in: #d39a6f; --board-line: #b97d55;
    --tray: #b9c4ce; --tray-in: #d6dde3; --tray-frame: #4f5b66;
    --rice: #fbf8f1; --rice-edge: #d9d2c4; --ink: #3a2219; --cream: #fff4e2;
    --go: #5fb84c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; justify-content: center;
    background: repeating-linear-gradient(0deg, var(--bg) 0 46px, var(--bg2) 46px 48px); }
  .app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; padding: 8px 10px 10px; gap: 6px; }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; }
  .screen.on { display: flex; }
  .btn { width: 48px; height: 48px; border-radius: 14px; border: 3px solid var(--ui); background: var(--plank-hi);
    color: var(--cream); font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 0 var(--ui); text-decoration: none; flex: none; padding: 0; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ui); }

  /* ---------- Màn hình chính ---------- */
  .homeTop { display: flex; align-items: center; justify-content: space-between; color: var(--cream); }
  .homeTop .title { font-weight: 900; font-size: 1.35rem; text-shadow: 0 2px 0 var(--ui); line-height: 1.1; }
  .homeTop .title small { display: block; font-size: .7rem; font-weight: 600; opacity: .85; text-shadow: none; }
  .coll { background: var(--plank); border: 3px solid var(--ui); border-radius: 12px; padding: 4px 10px; font-weight: 700;
    font-size: .85rem; box-shadow: 0 3px 0 var(--ui); }
  .cartWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .cartWrap svg { width: 100%; max-height: 100%; }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  .steam.s2 { animation-delay: .8s; } .steam.s3 { animation-delay: 1.6s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px); } }
  .bob { animation: bob 2.2s ease-in-out infinite; transform-origin: 150px 40px; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .play { margin: 0 auto 6px; width: min(300px, 100%); padding: 14px 10px; border-radius: 20px; border: 4px solid var(--ui);
    background: var(--go); color: #fff; font: inherit; font-size: 1.6rem; font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0 var(--ui); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .play:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ui); }
  .dev { text-align: center; color: var(--cream); font-size: .75rem; opacity: .8; }
  .dev select { font: inherit; font-size: .75rem; border-radius: 6px; }

  /* ---------- Màn chơi ---------- */
  header { display: flex; align-items: center; gap: 8px; }
  .plaque { flex: 1; background: var(--plank); border: 3px solid var(--ui); border-radius: 14px; padding: 6px;
    text-align: center; color: var(--cream); box-shadow: 0 3px 0 var(--ui); line-height: 1.15; }
  .plaque .lv { font-weight: 800; font-size: 1.1rem; }
  .plaque .sub { font-size: .8rem; opacity: .9; }
  .hint { color: var(--cream); font-size: .86rem; line-height: 1.25; min-height: 2.5em; text-align: center; padding: 0 4px;
    text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  svg#board { width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
  .bottom { display: flex; align-items: center; gap: 6px; }
  .hand { flex: 1; display: flex; gap: 6px; justify-content: center; min-height: 92px; touch-action: none; align-items: center; }
  .card { width: 70px; height: 90px; border-radius: 12px; background: var(--cream); border: 3px solid var(--ui);
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
    touch-action: none; cursor: grab; transition: opacity .15s; box-shadow: 0 3px 0 var(--ui); }
  .card[data-fam="mold"] { background: #ffe9c7; border-style: dashed; }
  .card[data-fam="diag"] { background: #ece3ff; }
  .card[data-fam="fn"], .card[data-fam="glue"] { background: #dcf3d6; border-color: #2f6b2a; box-shadow: 0 3px 0 #2f6b2a; }
  .card svg { width: 52px; height: 52px; }
  .card .nm { font-size: .68rem; font-weight: 700; color: var(--ink); }
  .card .rot { position: absolute; top: 1px; right: 4px; font-size: .78rem; color: #8a6a55; }
  .card.dragging { opacity: .25; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .empty { color: var(--cream); font-size: .82rem; text-align: center; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .box { background: var(--cream); border: 4px solid var(--ui); border-radius: 18px; padding: 20px; max-width: 320px; width: 100%; text-align: center; }
  .box h2 { margin: 0 0 4px; }
  .box p { margin: 4px 0; color: #6d5446; font-size: .9rem; }
  .box .unlock { margin-top: 8px; padding: 8px; border-radius: 10px; background: #fff; border: 2px dashed #c9a57e; font-weight: 700; }
  .box button { margin-top: 12px; padding: 10px 22px; border-radius: 12px; border: 3px solid var(--ui); background: var(--go);
    color: #fff; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--ui); }
</style>
</head>
<body>
<div class="app">

  <!-- ================= Màn hình chính ================= -->
  <section class="screen on" id="home">
    <div class="homeTop">
      <a class="btn" href="../" title="Danh sách prototype">⌂</a>
      <div class="title">Thẻ Cắt<small>prototype v4 · tên tạm</small></div>
      <div class="coll" id="collBadge">🍱 0</div>
    </div>
    <div class="cartWrap">
      <svg viewBox="0 0 300 270" aria-label="Xe bán cơm hộp">
        <ellipse cx="150" cy="252" rx="118" ry="10" fill="rgba(0,0,0,.18)"/>
        <!-- mái che sọc -->
        <g>
          <rect x="62" y="70" width="8" height="78" fill="#7a4a2e"/><rect x="230" y="70" width="8" height="78" fill="#7a4a2e"/>
          <path d="M30 46 Q150 22 270 46 L270 74 L30 74 Z" fill="#fff4e2" stroke="#4a2a24" stroke-width="4" stroke-linejoin="round"/>

                fill="#fff4e2" stroke="#4a2a24" stroke-width="4" stroke-linejoin="round"/>

          <path d="M126 30 q-6 -22 14 -24 q12 -12 26 0 q20 0 14 22 q4 14 -14 14 q-14 8 -26 0 q-18 2 -14 -12z" fill="#fff" stroke="#4a2a24" stroke-width="3.5"/>
          <circle cx="151" cy="22" r="11" fill="#ffc533" stroke="#4a2a24" stroke-width="3"/>
          <circle cx="147" cy="21" r="1.8" fill="#4a2a24"/><circle cx="155" cy="21" r="1.8" fill="#4a2a24"/>
          <path d="M147 26 q4 3 8 0" fill="none" stroke="#4a2a24" stroke-width="1.8" stroke-linecap="round"/>

        </g>
        <!-- mặt quầy + đồ trên quầy -->
        <g>
          <!-- chồng hộp cơm sắt -->

          <rect x="82" y="104" width="46" height="15" rx="5" fill="#c9d2da" stroke="#4f5b66" stroke-width="3"/>

          <rect x="160" y="110" width="8" height="5" rx="2" fill="#4a2a24"/><rect x="216" y="110" width="8" height="5" rx="2" fill="#4a2a24"/>

        <rect x="52" y="146" width="196" height="78" rx="10" fill="#f2b544" stroke="#4a2a24" stroke-width="4"/>

        <text x="150" y="184" text-anchor="middle" font-size="19" font-weight="900" fill="#fff4e2" font-family="Segoe UI, system-ui, sans-serif">CƠM HỘP</text>
        <rect x="60" y="202" width="180" height="8" rx="4" fill="#d99b2e"/>
        <rect x="248" y="170" width="26" height="7" rx="3.5" fill="#7a4a2e" stroke="#4a2a24" stroke-width="3"/>
        <!-- bánh xe -->
        <g fill="#3b3b44" stroke="#4a2a24" stroke-width="3">
          <circle cx="94" cy="228" r="21"/><circle cx="206" cy="228" r="21"/>

    </div>
    <button class="play" id="playBtn">▶ Level 1</button>
    <div class="dev">Chọn màn để test:
      <select id="devSel"></select>
    </div>

  <!-- ================= Màn chơi ================= -->
  <section class="screen" id="game">
    <header>
      <button class="btn" id="homeBtn" title="Màn hình chính">⌂</button>
      <div class="plaque">
        <div class="lv" id="lvName">Level 1</div>
        <div class="sub" id="cardsLeft">🃏 ×0</div>

</div>
<div class="overlay" id="win">
  <div class="box">
    <h2>Hoàn thành!</h2>

    <div class="unlock" id="winUnlock" hidden></div>
    <button id="nextBtn">Tiếp tục</button>

<script>
/* =========================================================================
   Mô hình: mỗi ô chia thành 4 tam giác  t = 0 trên, 1 phải, 2 dưới, 3 trái.
   Miếng cơm và khay đều là tập tam giác [x, y, t].
   Cạnh cắt (giữa các giao điểm lưới):
     h x,y  cạnh ngang trên ô (x,y)      v x,y  cạnh dọc trái ô (x,y)
     d x,y  chéo "\" trong ô (x,y)       a x,y  chéo "/" trong ô (x,y)
   Thẻ cắt là một đường gấp khúc trên giao điểm lưới. Đường khép kín = thẻ khuôn.
   Thẻ chức năng (v4): Xoay, Lật, Dán, Nhân bản. Nằm chung tay bài với thẻ cắt.
   Khay có thể có món cố định (trứng, xúc xích, thịt) chiếm sẵn vài ô.
   ========================================================================= */
const T4 = [0, 1, 2, 3];
const R = (w, h) => { const c = []; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) c.push([x, y]); return c; };
const full = cells => cells.flatMap(([x, y]) => T4.map(t => [x, y, t]));

/* ---------- Thẻ ---------- */
const LINE  = n => ({ fam: 'line', name: `Thẳng ${n}`, polys: [[[0, 0], [n, 0]]] });
const LINEV = n => ({ fam: 'line', name: `Thẳng ${n}`, polys: [[[0, 0], [0, n]]] });
const LCUT  = { fam: 'line', name: 'Chữ L', polys: [[[2, 0], [2, 1], [0, 1]]] };
const TCUT  = { fam: 'line', name: 'Chữ T', polys: [[[0, 0], [2, 0]], [[1, 0], [1, 1]]] };
const MOLD2 = { fam: 'mold', name: 'Khuôn 2×2', polys: [[[0, 0], [2, 0], [2, 2], [0, 2], [0, 0]]] };
const DIAG  = n => ({ fam: 'diag', name: `Chéo ${n}`, polys: [[[0, 0], [n, n]]] });
const DIAGA = n => ({ fam: 'diag', name: `Chéo ${n}`, polys: [[[n, 0], [0, n]]] });
const FN_ROT  = { fam: 'fn', kind: 'rot', name: 'Xoay' };
const FN_FLIP = { fam: 'fn', kind: 'flip', name: 'Lật' };
const FN_COPY = { fam: 'fn', kind: 'copy', name: 'Nhân bản' };
const FN_GLUE = { fam: 'glue', kind: 'glue', name: 'Dán', polys: [[[0, 0], [1, 0]]] };

/* ---------- Level: mỗi màn 1 khay, thớt 7×10 ----------
   rice: [{ s, at }]   tray: { s, at, walls?, fixed?: [{ kind, cells }] }   (toạ độ trong khay) */
const DIAMOND = [[1, 0, 1], [1, 0, 2], [0, 1, 1], [0, 1, 2], ...full([[1, 1]]), [2, 0, 2], [2, 0, 3], ...full([[2, 1]]), [3, 1, 2], [3, 1, 3],
                 [0, 2, 0], [0, 2, 1], ...full([[1, 2]]), [1, 3, 0], [1, 3, 1], ...full([[2, 2]]), [3, 2, 0], [3, 2, 3], [2, 3, 0], [2, 3, 3]];
const LEVELS = [
  { hint: 'Kéo thẻ lên cơm để cắt, rồi ráp các miếng cho kín hộp.',
    rice: [{ s: full(R(4, 1)), at: [1, 7] }], tray: { s: full(R(2, 2)), at: [2, 1] }, cards: [LINEV(1)] },
  { hint: 'Hộp lệch bậc thang. Chạm thẻ để xoay thẻ nếu cần.',
    rice: [{ s: full(R(3, 2)), at: [2, 6] }], tray: { s: full([[0, 0], [1, 0], [2, 0], [1, 1], [2, 1], [3, 1]]), at: [1, 1] }, cards: [LINE(3)] },
  { hint: 'Đường chữ L cắt góc. Ráp phần góc vào chỗ còn thiếu.',
    rice: [{ s: full(R(3, 3)), at: [2, 6] }], tray: { s: full([[2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2], [0, 3], [1, 3]]), at: [2, 0] }, cards: [LCUT] },
  { hint: 'Hộp có sẵn trứng ốp la. Lấp cơm quanh món có sẵn.',
    rice: [{ s: full(R(5, 1)), at: [1, 7] }], tray: { s: full(R(3, 2)), at: [2, 1], fixed: [{ kind: 'egg', cells: [[1, 0]] }] }, cards: [LINEV(1), LINEV(1)] },
  { hint: 'Hộp có vách ngăn (vạch đậm): miếng cơm không được nằm vắt qua vách.',
    rice: [{ s: full(R(2, 3)), at: [2, 6] }], tray: { s: full(R(3, 2)), at: [2, 1], walls: [[1, 0, 1, 2]] }, cards: [LINE(2), LINEV(1)] },
  { hint: 'Miếng cơm không tự xoay được. Kéo thẻ Xoay (thẻ xanh) lên miếng cơm. Chạm thẻ để đổi chiều.',
    rice: [{ s: full(R(3, 2)), at: [2, 7] }], tray: { s: full(R(2, 3)), at: [2, 1] }, cards: [FN_ROT] },
  { hint: 'Xoay mấy cũng không vừa? Thẻ Lật soi gương miếng cơm. Chạm thẻ để đổi lật ngang / dọc.',
    rice: [{ s: full([[1, 0], [2, 0], [0, 1], [1, 1]]), at: [2, 7] }], tray: { s: full([[0, 0], [1, 0], [1, 1], [2, 1]]), at: [2, 1] }, cards: [FN_FLIP] },
  { hint: 'Thẻ chữ T chia miếng cơm thành 3 phần.',
    rice: [{ s: full(R(2, 2)), at: [2, 7] }], tray: { s: full([[0, 0], [1, 0], [1, 1], [1, 2]]), at: [2, 1] }, cards: [TCUT] },
  { hint: 'Khuôn 2×2 lấy ra đúng một khối vuông. Hộp có sẵn xúc xích.',
    rice: [{ s: full(R(4, 2)), at: [1, 7] }],
    tray: { s: full([[1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [3, 1], [0, 2], [1, 2], [2, 2], [3, 2]]), at: [1, 1], fixed: [{ kind: 'sausage', cells: [[1, 2], [2, 2]] }] },
    cards: [MOLD2] },
  { hint: 'Chỉ có 1 thẻ Xoay mà cần xoay 2 miếng? Đặt 2 miếng sát nhau, dùng thẻ Dán lên đường nối, rồi xoay cả khối.',
    rice: [{ s: full(R(3, 1)), at: [1, 6] }, { s: full(R(3, 1)), at: [3, 8] }], tray: { s: full(R(2, 3)), at: [2, 1] }, cards: [FN_GLUE, FN_ROT] },
  { hint: 'Thẻ Nhân bản tạo thêm một miếng giống hệt (miếng tối đa 2 ô).',
    rice: [{ s: full(R(2, 1)), at: [2, 7] }], tray: { s: full(R(3, 2)), at: [2, 1], fixed: [{ kind: 'meat', cells: [[2, 0], [2, 1]] }] }, cards: [FN_COPY] },
  { hint: 'Hộp hình viên kẹo ◇. Thẻ chéo hai hướng là chìa khoá.',
    rice: [{ s: full(R(4, 2)), at: [1, 7] }], tray: { s: DIAMOND, at: [1, 1] }, cards: [LINEV(2), DIAGA(2), DIAG(2)], unlock: 'Hộp viên kẹo ◇' },
];

/* ======================= Trạng thái ======================= */
const COLS = 7, ROWS = 10;
let levelIdx = 0, foods = [], trays = [], hand = [], history = [], nextId = 1;
let drag = null, lastCut = null, won = false;
const key3 = (x, y, t) => x + ',' + y + ',' + t;
const svg = document.getElementById('board'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);

/* Tiến trình lưu trong trình duyệt (chỉ để tiện test) */
const store = {
  get(k, d) { try { const v = localStorage.getItem('cutcard.v4.' + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('cutcard.v4.' + k, JSON.stringify(v)); } catch (_) {} },
};
let progress = store.get('level', 0), collection = store.get('collection', []);

function loadLevel(i) {
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  const L = LEVELS[levelIdx], tr = L.tray;
  nextId = 1;
  foods = L.rice.map(r => ({ id: nextId++, tris: r.s.map(([x, y, t]) => [x + r.at[0], y + r.at[1], t]) }));
  trays = [{ id: 100, tris: tr.s.map(([x, y, t]) => [x + tr.at[0], y + tr.at[1], t]),
    walls: (tr.walls || []).map(([x1, y1, x2, y2]) => [x1 + tr.at[0], y1 + tr.at[1], x2 + tr.at[0], y2 + tr.at[1]]),
    fixed: (tr.fixed || []).map(f => ({ kind: f.kind, cells: f.cells.map(([x, y]) => [x + tr.at[0], y + tr.at[1]]) })) }];
  hand = L.cards.map(c => ({ def: c, rot: 0, used: false }));
  history = []; won = false;
  $('lvName').textContent = `Level ${levelIdx + 1}`;
  $('hint').textContent = L.hint;
  $('win').classList.remove('show');
  render(); renderHand();
}

/* ======================= Hình học ======================= */
function cardGeom(card) {

}
function applyFn(res) {

  else res.target.tris = res.tris;
}

function triAt(wx, wy) {

/* ======================= Lịch sử (hoàn tác miễn phí) ======================= */

/* ======================= Vẽ ======================= */

      if (nx === x && ny === y) out.push(nt === (t + 1) % 4 ? [b, c] : [a, c]);
      else out.push([a, b]);

}

  boundary(tris).forEach(([p, q]) => el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: edge, 'stroke-width': w, 'stroke-linecap': 'round' }, g));

}

  const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0 + 1, h = Math.max(...ys) - y0 + 1;
  if (f.kind === 'egg') f.cells.forEach(([x, y]) => {
    el('path', { d: `M${x + .2} ${y + .5} q-.05 -.35 .3 -.38 q.2 -.12 .35 .02 q.22 .05 .12 .35 q.05 .3 -.3 .3 q-.4 .05 -.47 -.29z`,
      fill: '#fff', stroke: '#c9c0b0', 'stroke-width': .04 }, parent);

    for (let i = 1; i < w * 2; i++) if (i % 2) el('line', { x1: x0 + i * .5 - .08, y1: y0 + .38, x2: x0 + i * .5 + .08, y2: y0 + h - .38, stroke: '#8e3324', 'stroke-width': .04, 'stroke-linecap': 'round' }, parent);
  }
  if (f.kind === 'meat') {
    el('rect', { x: x0 + .12, y: y0 + .12, width: w - .24, height: h - .24, rx: .18, fill: '#9a5b34', stroke: '#5e3218', 'stroke-width': .05 }, parent);
    for (let i = 1; i <= 3; i++) el('line', { x1: x0 + .25, y1: y0 + i * h / 4 - .1, x2: x0 + w - .25, y2: y0 + i * h / 4 + .1, stroke: '#5e3218', 'stroke-width': .06, 'stroke-linecap': 'round' }, parent);

  const count = {};
  tr.tris.forEach(([x, y]) => { const k = x + ',' + y; count[k] = (count[k] || 0) + 1; });
  Object.keys(count).forEach(k => { if (count[k] < 4) return;
    const [x, y] = k.split(',').map(Number);

    el('ellipse', { cx: (a[0] + b[0] + c[0]) / 3, cy: (a[1] + b[1] + c[1]) / 3, rx: .07, ry: .045, fill: '#e9e3d6',
      transform: `rotate(${(i * 47) % 180} ${(a[0] + b[0] + c[0]) / 3} ${(a[1] + b[1] + c[1]) / 3})` }, g); });

function render() {

  svg.setAttribute('viewBox', `${-pad} ${-pad} ${COLS + pad * 2} ${ROWS + pad * 2}`);
  el('rect', { x: -.3, y: -.3, width: COLS + .6, height: ROWS + .6, rx: .45, fill: 'var(--board)', stroke: 'var(--ui)', 'stroke-width': .08 }, svg);
  el('rect', { x: 0, y: 0, width: COLS, height: ROWS, rx: .2, fill: 'var(--board-in)' }, svg);
  for (let x = 1; x < COLS; x++) el('line', { x1: x, y1: 0, x2: x, y2: ROWS, stroke: 'var(--board-line)', 'stroke-width': .025 }, svg);
  for (let y = 1; y < ROWS; y++) el('line', { x1: 0, y1: y, x2: COLS, y2: y, stroke: 'var(--board-line)', 'stroke-width': .025 }, svg);

  const moving = drag && drag.moved ? drag : null;
  const carried = moving && moving.type === 'tray' ? foodsInside(moving.tray) : [];
  trays.forEach(t => { if (!(moving && moving.tray === t)) drawTray(svg, t); });
  foods.forEach(f => { if (!(moving && (moving.food === f || carried.includes(f)))) drawFood(svg, f); });
  drawWallsOnTop(svg);

  const r = moving && moving.type === 'card' ? moving.res : null;
  if (r && r.kind === 'cut') {
    r.splits.forEach(({ parts }) => parts.forEach((tris, i) => tint(svg, tris, TINT[i % TINT.length])));
    r.segs.forEach(([x1, y1, x2, y2]) => el('line', { x1, y1, x2, y2, stroke: r.valid ? '#d6332a' : '#7d6f66', 'stroke-width': .14,
      'stroke-linecap': 'round', 'stroke-dasharray': r.valid ? '' : '.18 .12' }, svg));
  }
  if (r && r.kind === 'glue') {
    r.touched.forEach(f => tint(svg, f.tris, 'rgba(90,180,100,.40)'));
    r.segs.forEach(([x1, y1, x2, y2]) => el('line', { x1, y1, x2, y2, stroke: r.valid ? '#2f9e44' : '#7d6f66', 'stroke-width': .16,
      'stroke-linecap': 'round', 'stroke-dasharray': r.valid ? '.05 .12' : '.18 .12' }, svg));
  }
  if (r && (r.kind === 'rot' || r.kind === 'flip' || r.kind === 'copy')) {
    if (r.target) tint(svg, r.target.tris, r.valid ? 'rgba(90,180,100,.35)' : 'rgba(214,51,42,.30)');
    if (r.valid) outline(svg, r.tris, '#2f9e44');
    el('circle', { cx: r.point[0], cy: r.point[1], r: .16, fill: r.valid ? '#2f9e44' : '#7d6f66', stroke: '#fff', 'stroke-width': .05 }, svg);
  }
  if (moving && (moving.type === 'food' || moving.type === 'tray')) {
    const dx = Math.round(moving.fx), dy = Math.round(moving.fy);
    const ok = moving.type === 'food' ? canPlaceFood(moving.food, shift(moving.food.tris, dx, dy)) : canPlaceTray(moving.tray, dx, dy);
    outline(svg, shift(moving.type === 'food' ? moving.food.tris : moving.tray.tris, dx, dy), ok ? '#3d9a4e' : '#d6332a');
    const lift = el('g', { opacity: .95, filter: 'drop-shadow(0 .15px .1px rgba(0,0,0,.35))' }, svg);
    if (moving.type === 'tray') { drawTray(lift, moving.tray, moving.fx, moving.fy); carried.forEach(f => drawFood(lift, f, moving.fx, moving.fy)); }
    else drawFood(lift, moving.food, moving.fx, moving.fy);
  }
  if (lastCut) {
    lastCut.segs.forEach(([x1, y1, x2, y2]) => el('line', { x1, y1, x2, y2, stroke: lastCut.color, 'stroke-width': .16, 'stroke-linecap': 'round' }, svg)
      .animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, fill: 'forwards' }));
    lastCut = null;
  }
  $('cardsLeft').textContent = `🃏 ×${hand.filter(c => !c.used).length}`;
}

    el('line', { x1: 0, y1: i, x2: N, y2: i, stroke: '#d9c6ad', 'stroke-width': .05 }, s);
  }
  const g = cardGeom(card), ox = Math.floor((N - g.w) / 2), oy = Math.floor((N - g.h) / 2), col = FAM_COLOR[card.def.fam];
  g.polys.forEach(pl => {
    const pts = pl.map(([x, y]) => `${x + ox},${y + oy}`).join(' ');
    if (card.def.fam === 'mold') el('polygon', { points: pts, fill: 'rgba(240,160,80,.45)' }, s);
    el('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': .24, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'stroke-dasharray': card.def.fam === 'glue' ? '.05 .3' : '' }, s);
  });
  return s;
}
function renderHand() {
  handEl.innerHTML = '';
  hand.forEach((c, i) => {
    if (c.used) return;
    const d = document.createElement('div');
    d.className = 'card'; d.dataset.i = i; d.dataset.fam = c.def.fam;
    d.appendChild(cardSVG(c));
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = c.def.name; d.appendChild(nm);
    if (c.def.kind !== 'copy') { const r = document.createElement('div'); r.className = 'rot'; r.textContent = '↻'; d.appendChild(r); }
    d.addEventListener('pointerdown', e => cardDown(e, i, d));
    handEl.appendChild(d);
  });
  if (!hand.some(c => !c.used)) {
    const p = document.createElement('div'); p.className = 'empty';
    p.textContent = 'Hết thẻ. Xếp cơm vào hộp, hoặc hoàn tác.'; handEl.appendChild(p);
  }
  render();
}

/* ======================= Điều khiển ======================= */
function toWorld(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const w = pt.matrixTransform(svg.getScreenCTM().inverse()); return [w.x, w.y];
}
const tapPx = touch => touch ? 12 : 5;
function cardDown(e, i, d) {
  if (drag) return;
  e.preventDefault(); try { d.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { type: 'card', i, d, sx: e.clientX, sy: e.clientY, moved: false, res: null, touch: e.pointerType === 'touch', pid: e.pointerId };
}
svg.addEventListener('pointerdown', e => {
  if (drag) return;
  const [wx, wy] = toWorld(e), q = triAt(wx, wy);
  const f = foods.find(o => has(o, q));
  let t = f ? null : trays.find(o => has(o, q));
  if (!f && !t) {   // chạm vào viền khay cũng nắm được khay
    for (const [ox, oy] of [[.3, 0], [-.3, 0], [0, .3], [0, -.3], [.3, .3], [-.3, .3], [.3, -.3], [-.3, -.3]]) {
      t = trays.find(o => has(o, triAt(wx + ox, wy + oy))); if (t) break;
    }
  }
  if (!f && !t) return;
  e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { type: f ? 'food' : 'tray', food: f, tray: t, wx, wy, sx: e.clientX, sy: e.clientY, fx: 0, fy: 0, moved: false,
           pid: e.pointerId, touch: e.pointerType === 'touch' };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < tapPx(drag.touch)) return;
  drag.moved = true;
  if (drag.type !== 'card') { const [wx, wy] = toWorld(e); drag.fx = wx - drag.wx; drag.fy = wy - drag.wy; render(); return; }
  drag.d.classList.add('dragging');
  const card = hand[drag.i];
  let [wx, wy] = toWorld(e);
  if (drag.touch) wy -= 1.3;   // điểm tác động nổi lên trên ngón tay
  if (card.def.fam === 'fn') {
    const k = key3(...triAt(wx, wy));
    if (drag.k !== k || !drag.res) { drag.k = k; drag.res = evaluateFn(card, wx, wy); }
    drag.res.point = [wx, wy]; render(); return;
  }
  const g = cardGeom(card), ox = Math.round(wx - g.w / 2), oy = Math.round(wy - g.h / 2);
  if (!drag.res || drag.ox !== ox || drag.oy !== oy) {
    drag.ox = ox; drag.oy = oy;
    drag.res = card.def.fam === 'glue' ? evaluateGlue(card, ox, oy) : evaluateCut(card, ox, oy);
    render();
  }
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dr = drag; drag = null;
  if (dr.type === 'food' || dr.type === 'tray') {
    const dx = Math.round(dr.fx), dy = Math.round(dr.fy);
    if (!cancelled && dr.moved && (dx || dy)) {
      if (dr.type === 'food' && canPlaceFood(dr.food, shift(dr.food.tris, dx, dy))) {
        pushHistory(); dr.food.tris = shift(dr.food.tris, dx, dy); sfx('drop');
      } else if (dr.type === 'tray' && canPlaceTray(dr.tray, dx, dy)) {
        pushHistory(); foodsInside(dr.tray).forEach(f => f.tris = shift(f.tris, dx, dy)); dr.tray.tris = shift(dr.tray.tris, dx, dy);
        dr.tray.walls = dr.tray.walls.map(([a, b, c, d]) => [a + dx, b + dy, c + dx, d + dy]);
        dr.tray.fixed.forEach(f => f.cells = f.cells.map(([x, y]) => [x + dx, y + dy])); sfx('drop');
      } else sfx('bad');
    }
    render(); checkWin(); return;
  }
  dr.d.classList.remove('dragging');
  if (cancelled) { render(); return; }
  const card = hand[dr.i];
  if (!dr.moved) {   // chạm = xoay thẻ / đổi chiều
    if (card.def.kind === 'copy') { render(); return; }
    pushHistory(); card.rot = (card.rot + 1) % 4; sfx('rot'); renderHand(); return;
  }
  const res = dr.res;
  if (res && res.valid) {
    pushHistory();
    if (res.kind === 'cut') { applyCut(res); lastCut = { segs: res.segs, color: '#fff' }; sfx('cut'); }
    else if (res.kind === 'glue') { applyGlue(res); lastCut = { segs: res.segs, color: '#9be59b' }; sfx('pop'); }
    else { applyFn(res); sfx('pop'); }
    card.used = true; renderHand(); checkWin();
  } else {
    if (res && res.why) $('hint').textContent = res.why;
    renderHand(); sfx('bad');
    const c = handEl.querySelector(`.card[data-i="${dr.i}"]`); if (c) c.classList.add('shake');
  }
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

/* ======================= Âm thanh ======================= */
let ac = null;
function sfx(kind) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    if (kind === 'cut') {
      const len = .12, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2400; g.gain.value = .6;
      src.connect(f).connect(g).connect(ac.destination); src.start(t); return;
    }
    const o = ac.createOscillator(), g = ac.createGain();
    const [fq, du] = ({ drop: [520, .06], rot: [700, .05], bad: [160, .15], win: [880, .3], pop: [620, .12] })[kind] || [440, .05];
    o.frequency.value = fq; o.type = kind === 'bad' ? 'square' : 'sine';
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + du);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + du);
  } catch (_) {}
}

/* ======================= Màn hình ======================= */
function showHome() {
  $('home').classList.add('on'); $('game').classList.remove('on'); $('win').classList.remove('show');
  $('playBtn').textContent = `▶ Level ${progress + 1}`;
  $('collBadge').textContent = `🍱 ${collection.length}`;
  $('collBadge').title = collection.length ? 'Bộ sưu tập: ' + collection.join(', ') : 'Bộ sưu tập hộp hình bóng (chưa có)';
  $('devSel').value = String(progress);
}
function startLevel(i) { $('home').classList.remove('on'); $('game').classList.add('on'); loadLevel(i); }
LEVELS.forEach((L, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `Level ${i + 1}`; $('devSel').appendChild(o); });
$('devSel').onchange = e => { progress = +e.target.value; store.set('level', progress); showHome(); };
$('playBtn').onclick = () => startLevel(progress);
$('homeBtn').onclick = showHome;
$('resetBtn').onclick = () => loadLevel(levelIdx);
$('undoBtn').onclick = undo;
$('nextBtn').onclick = () => levelIdx === LEVELS.length - 1 ? showHome() : loadLevel(levelIdx + 1);
window.addEventListener('resize', () => { if ($('game').classList.contains('on')) render(); });
if (progress >= LEVELS.length) progress = 0;
showHome();

/* ======================= Solver (console: selfTest()) =======================
   Làm việc trên hình dạng các miếng (không quan tâm vị trí trên thớt):
   thẻ cắt chia 1 miếng; Xoay / Lật biến hình 1 miếng; Dán ghép 2 miếng kề nhau;
   Nhân bản thêm 1 bản sao. Thành công khi một tập con các miếng phủ kín đúng phần
   trống của hộp (chỉ tịnh tiến, không vắt qua vách). */
const shapeKey = tris => tris.map(q => key3(...q)).sort().join(';');
function successors(card, shapes) {
  const out = [], seen = new Set(), push = (desc, list) => {
    const n = list.map(normalize), k = n.map(shapeKey).sort().join('/');
    if (!seen.has(k)) { seen.add(k); out.push([desc, n]); }
  };
  const rest = i => shapes.filter((_, j) => j !== i);
  const kind = card.def.kind || 'cut';
  shapes.forEach((S, i) => {
    if (kind === 'cut') for (let r = 0; r < 4; r++) {
      const c = { def: card.def, rot: r }, g = cardGeom(c), b = bbox(S);
      for (let ox = b.minx - g.w; ox <= b.maxx + 1; ox++) for (let oy = b.miny - g.h; oy <= b.maxy + 1; oy++) {
        const parts = components(S, segKeys(unitSegments(g.polys, ox, oy)));
        if (parts.length > 1) push(`${card.def.name} xoay ${r * 90}° tại (${ox},${oy}) lên miếng ${i}`, [...rest(i), ...parts]);
      }
    }
    if (kind === 'rot' || kind === 'flip') [0, 1].forEach(d => push(`${card.def.name} (${FN_ICON[kind][d]}) miếng ${i}`, [...rest(i), transformFn(kind, d, S)]));
    if (kind === 'copy' && S.length <= 8) push(`Nhân bản miếng ${i}`, [...shapes, S]);
    if (kind === 'glue') shapes.forEach((T, j) => {
      if (j <= i) return;
      const a = bbox(S), b = bbox(T), sk = new Set(S.map(q => key3(...q)));
      for (let dx = a.minx - b.maxx - 1; dx <= a.maxx + 1; dx++) for (let dy = a.miny - b.maxy - 1; dy <= a.maxy + 1; dy++) {
        const M = shift(T, dx, dy);
        if (M.some(q => sk.has(key3(...q)))) continue;
        const mk = new Set(M.map(q => key3(...q)));
        if (!S.some(q => { const n = neighbors(...q)[2]; return mk.has(key3(n[0], n[1], n[2])); })) continue;
        push(`Dán miếng ${i} + ${j}`, [...shapes.filter((_, k) => k !== i && k !== j), [...S, ...M]]);
      }
    });
  });
  return out;
}
function packShapes(shapes, need, wk) {
  const order = (a, b) => a[1] - b[1] || a[0] - b[0] || a[2] - b[2];
  const target = need.slice().sort(order), tset = new Set(target.map(q => key3(...q)));
  if (shapes.reduce((s, p) => s + p.length, 0) < target.length) return false;
  const covered = new Set(), used = shapes.map(() => false), pieces = shapes.map(p => p.slice().sort(order));
  const rec = () => {
    const first = target.find(q => !covered.has(key3(...q)));
    if (!first) return true;
    for (let i = 0; i < pieces.length; i++) {
      if (used[i]) continue;
      const p = pieces[i], a = p[0];
      if (a[2] !== first[2]) continue;
      const moved = shift(p, first[0] - a[0], first[1] - a[1]);
      if (!moved.every(q => tset.has(key3(...q)) && !covered.has(key3(...q))) || crossesWall(moved, wk)) continue;
      used[i] = true; moved.forEach(q => covered.add(key3(...q)));
      if (rec()) return true;
      used[i] = false; moved.forEach(q => covered.delete(key3(...q)));
    }
    return false;
  };
  return rec();
}
function solve(skip = -1) {
  const need = trays.flatMap(trayNeed), wk = allWallKeys(), seen = new Set();
  const rec = (shapes, used) => {
    const sk = used.join('') + '|' + shapes.map(shapeKey).sort().join('/');
    if (seen.has(sk)) return null; seen.add(sk);
    if (packShapes(shapes, need, wk)) return [];
    for (let i = 0; i < hand.length; i++) {
      if (used[i]) continue;
      for (const [desc, next] of successors(hand[i], shapes)) {
        const u = used.slice(); u[i] = 1;
        const r = rec(next, u); if (r) return [desc, ...r];
      }
    }
    return null;
  };
  return rec(foods.map(f => normalize(f.tris)), hand.map((_, i) => i === skip ? 1 : 0));
}
window.selfTest = function () {
  const out = [];
  for (let i = 0; i < LEVELS.length; i++) {
    loadLevel(i);
    const sol = solve();
    const need = hand.map((c, j) => solve(j) ? null : c.def.name).filter(Boolean);
    out.push(`Level ${i + 1}: ${sol ? 'giải được: ' + (sol.join(' → ') || 'không cần thẻ') : 'KHÔNG giải được'} · thẻ bắt buộc: ${need.join(', ') || 'không'}`);
  }
  showHome(); return out;
};
